<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pokémon TCG Pocket 對戰 — 組牌</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #07091a;
    --surface: rgba(255,255,255,0.05);
    --border:  rgba(255,255,255,0.10);
    --text:    #e8eaf6;
    --muted:   #7986cb;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  #stars { position:fixed; inset:0; z-index:0; pointer-events:none; }

  .page { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }

  header.top { padding:1rem 1.4rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  header.top h1 { font-size:1.15rem; font-weight:800; background:linear-gradient(135deg,#f8d030 0%,#f05030 50%,#6890f0 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  header.top .sub { color:var(--muted); font-size:0.8rem; }

  .layout { flex:1; display:grid; grid-template-columns:1fr 340px; gap:0; min-height:0; }
  @media (max-width: 880px) { .layout { grid-template-columns:1fr; } }
  @media (max-width: 480px) {
    .board-top-bar { flex-wrap:wrap; gap:0.4rem; }
    .board-slot { width:62px; font-size:0.56rem; }
    .active-row .board-slot { width:78px; font-size:0.62rem; }
    .bench-row { gap:0.35rem; }
    .attack-row { width:100%; padding:0 0.6rem; }
    .setup-box, .peek-box { padding:1.1rem; }
  }

  /* ── pool ── */
  .pool { padding:1rem 1.2rem 2rem; min-width:0; }
  .filters { display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1rem; position:sticky; top:0; background:rgba(7,9,26,0.92); backdrop-filter:blur(6px); padding:0.6rem 0; z-index:5; }
  .filters input, .filters select { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:0.5rem 0.8rem; border-radius:8px; font-size:0.85rem; }
  .filters input { flex:1; min-width:140px; }
  .pool-count { color:var(--muted); font-size:0.8rem; margin-bottom:0.6rem; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:0.7rem; }
  .card-tile { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:0.5rem; cursor:pointer; transition:transform .15s, border-color .15s; position:relative; }
  .card-tile:hover:not(.maxed) { transform:translateY(-3px); border-color:rgba(255,255,255,0.28); }
  .card-tile.maxed { opacity:0.35; cursor:not-allowed; }
  .card-tile img { width:100%; border-radius:6px; display:block; background:#111; aspect-ratio:5/7; object-fit:cover; }
  .card-tile .name { font-size:0.72rem; font-weight:700; margin-top:0.4rem; line-height:1.2; }
  .card-tile .meta { font-size:0.65rem; color:var(--muted); margin-top:0.15rem; }
  .card-tile .type-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:3px; }
  .card-tile .count-badge { position:absolute; top:4px; right:4px; background:#f05030; color:#fff; font-size:0.65rem; font-weight:800; border-radius:999px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

  /* ── deck panel ── */
  .deck-panel { border-left:1px solid var(--border); background:rgba(255,255,255,0.02); padding:1rem 1.1rem 1.5rem; display:flex; flex-direction:column; gap:0.8rem; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto; }
  .deck-count { font-size:1.4rem; font-weight:800; }
  .deck-count .ok { color:#69f0ae; }
  .deck-count .bad { color:#ff8a80; }
  .deck-warn { font-size:0.78rem; color:#ffab91; background:rgba(255,138,101,0.08); border:1px solid rgba(255,138,101,0.25); border-radius:8px; padding:0.5rem 0.7rem; display:none; }
  .deck-warn.show { display:block; }
  .deck-list { display:flex; flex-direction:column; gap:0.35rem; flex:1; overflow-y:auto; }
  .deck-row { display:flex; align-items:center; gap:0.5rem; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:0.4rem 0.5rem; font-size:0.78rem; }
  .deck-row img { width:28px; height:39px; border-radius:4px; object-fit:cover; background:#111; }
  .deck-row .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deck-row .x { color:var(--muted); font-weight:700; }
  .deck-row button { background:rgba(255,255,255,0.08); border:1px solid var(--border); color:var(--text); border-radius:6px; width:22px; height:22px; cursor:pointer; font-size:0.8rem; line-height:1; }
  .deck-row button:hover { background:rgba(255,255,255,0.16); }
  .deck-empty { color:var(--muted); font-size:0.8rem; text-align:center; padding:2rem 0; }

  .btn { padding:0.6rem 1rem; border:none; border-radius:999px; font-size:0.85rem; font-weight:700; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:linear-gradient(135deg,#f8d030,#f05030); color:#fff; }
  .btn-primary:disabled { opacity:0.35; cursor:not-allowed; }
  .btn-secondary { background:rgba(255,255,255,0.07); color:var(--text); border:1px solid var(--border); }
  .btn-secondary:hover { background:rgba(255,255,255,0.13); }
  .btn-row { display:flex; gap:0.5rem; }
  .btn-row .btn { flex:1; }

  .save-toast { position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%) translateY(20px); background:#1b2040; border:1px solid var(--border); color:var(--text); padding:0.6rem 1.2rem; border-radius:999px; font-size:0.85rem; opacity:0; transition:all .25s; z-index:50; pointer-events:none; }
  .save-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ── lobby modal ── */
  .lobby-overlay { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.55); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; }
  .lobby-overlay.open { display:flex; }
  .lobby-box { position:relative; background:#10132b; border:1px solid var(--border); border-radius:16px; padding:2rem 2.2rem; width:min(90vw,380px); text-align:center; }
  .lobby-box h2 { font-size:1.2rem; margin-bottom:0.6rem; }
  .lobby-sub { color:var(--muted); font-size:0.85rem; margin-bottom:1rem; }
  .lobby-close { position:absolute; top:0.7rem; right:0.9rem; background:none; border:none; color:var(--muted); font-size:1rem; cursor:pointer; }
  .lobby-close:hover { color:var(--text); }
  .join-row { display:flex; gap:0.5rem; margin-top:0.8rem; }
  .join-row input { flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:0.6rem 0.8rem; border-radius:8px; text-align:center; letter-spacing:0.1em; text-transform:uppercase; font-size:0.9rem; }
  .lobby-error { color:#ff8a80; font-size:0.8rem; margin-top:0.7rem; min-height:1em; }
  .room-code { font-size:2.2rem; font-weight:800; letter-spacing:0.15em; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:0.8rem; margin-bottom:0.8rem; }

  /* ── board ── */
  .board-overlay { position:fixed; inset:0; z-index:60; background:var(--bg); display:none; flex-direction:column; overflow-y:auto; }
  .board-overlay.open { display:flex; }
  .board-top-bar { display:flex; justify-content:space-between; align-items:center; padding:0.6rem 1rem; border-bottom:1px solid var(--border); font-size:0.85rem; }
  .points-row { display:flex; gap:1.2rem; color:var(--muted); }
  .points-side { display:flex; align-items:center; gap:0.4rem; }
  .points-side b { color:var(--text); font-size:1.1rem; min-width:1.2em; text-align:center; }
  .point-markers { display:flex; gap:0.22rem; }
  .point-marker { width:0.6rem; height:0.6rem; border-radius:50%; border:1.5px solid var(--border); background:transparent; transition:background 0.2s, border-color 0.2s, box-shadow 0.2s; }
  .point-marker.filled { background:#f8d030; border-color:#f8d030; box-shadow:0 0 6px rgba(248,208,48,0.7); }
  .points-side.win-flash .point-marker.filled { animation: point-pop 0.4s ease; }
  @keyframes point-pop { 0%{ transform:scale(1.6); } 100%{ transform:scale(1); } }
  .side-info { text-align:center; font-size:0.75rem; color:var(--muted); padding:0.3rem; }
  .opp-area, .my-area { padding:0.5rem 1rem; }
  /* 2026-08-05版面重排：bench-row跟active-row原本各自獨立一整列（上下堆疊），現在包進
     .field-row用flex橫排在同一列——省掉一整列的垂直高度，順便用上原本沒利用到的左右空間 */
  .field-row { display:flex; align-items:center; justify-content:center; gap:0.8rem; flex-wrap:wrap; }
  .bench-row { display:flex; gap:0.4rem; }
  .active-row { display:flex; }
  .mid-area { display:flex; align-items:center; justify-content:center; gap:1rem; padding:0.25rem; min-height:30px; }
  .energy-zone { width:34px; height:34px; border-radius:50%; border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:0.7rem; cursor:pointer; }
  .energy-zone.has-energy { border-style:solid; cursor:pointer; }
  .energy-zone.picking { box-shadow:0 0 0 3px rgba(248,208,48,0.5); }
  .action-hint { color:#ffd54f; font-size:0.8rem; min-height:1.2em; }
  .action-hint.active { background:rgba(248,208,48,0.12); border:1px solid rgba(248,208,48,0.4); border-radius:999px; padding:0.4rem 1rem; display:flex; align-items:center; gap:0.6rem; }
  .action-hint .hint-cancel { background:none; border:1px solid rgba(255,213,79,0.6); color:#ffd54f; border-radius:999px; padding:0.1rem 0.6rem; font-size:0.72rem; cursor:pointer; }
  .detail-actions { display:flex; flex-direction:column; gap:0.5rem; margin-top:0.8rem; }
  .detail-actions button { width:100%; }

  .board-slot { width:76px; text-align:center; font-size:0.62rem; cursor:default; }
  .board-slot.empty { border:1px dashed var(--border); border-radius:8px; height:100%; min-height:60px; }
  .board-slot img { width:100%; border-radius:6px; background:#111; aspect-ratio:5/7; object-fit:cover; }
  .board-slot.pickable img { outline:2px solid #ffd54f; cursor:pointer; }
  .board-slot .board-name { font-weight:700; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .active-row .board-slot { width:96px; font-size:0.7rem; }
  .hp-bar { height:5px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; margin-top:2px; }
  .hp-fill { height:100%; background:#69f0ae; transition:width 0.35s ease, background 0.35s ease; }
  .hp-fill.low { background:#ff8a80; }
  .energy-row { display:flex; gap:2px; justify-content:center; margin-top:2px; flex-wrap:wrap; }
  .energy-icon { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .mini-btn { font-size:0.58rem; background:rgba(255,255,255,0.1); border:1px solid var(--border); color:var(--text); border-radius:5px; padding:1px 4px; margin-top:2px; cursor:pointer; }
  .mini-btn:hover { background:rgba(255,255,255,0.2); }
  .peek-overlay { position:fixed; inset:0; z-index:90; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; }
  .peek-box { background:#10132b; border:1px solid var(--border); border-radius:16px; padding:1.4rem; width:min(90vw,420px); text-align:center; }
  .peek-list { display:flex; gap:0.4rem; justify-content:center; flex-wrap:wrap; margin:1rem 0; }
  .peek-list img { width:70px; border-radius:6px; }

  /* 2026-08-05：招式按鈕原本一個招式一整列（column），4招疊起來佔掉很大一塊垂直高度——
     改成橫向排列、自動換行，跟「結束回合」按鈕合併進同一條.action-bar，省掉原本
     額外一整列turn-controls的高度 */
  .action-bar { display:flex; align-items:center; justify-content:center; gap:0.6rem; flex-wrap:wrap; padding:0.3rem 0.8rem; }
  .attack-row { display:flex; flex-wrap:wrap; gap:0.4rem; justify-content:center; flex:1 1 auto; max-width:560px; }
  .attack-btn { display:flex; justify-content:space-between; align-items:center; gap:0.5rem; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:0.4rem 0.7rem; cursor:pointer; font-size:0.78rem; flex:1 1 240px; }
  .attack-btn:hover:not(:disabled) { background:rgba(255,255,255,0.1); }
  .attack-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .attack-cost { display:flex; gap:2px; }

  .turn-controls { display:flex; gap:0.5rem; flex-shrink:0; }
  .hand-row { display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap; padding:0.5rem 0 0.8rem; }
  .hand-row .board-slot img { cursor:pointer; }
  .hand-row .board-slot img:hover { outline:2px solid #ffd54f; }

  .setup-overlay { position:absolute; inset:0; z-index:70; background:rgba(0,0,0,0.75); display:flex; align-items:center; justify-content:center; }
  .setup-box { background:#10132b; border:1px solid var(--border); border-radius:16px; padding:1.6rem; width:min(92vw,560px); text-align:center; max-height:85vh; overflow-y:auto; }
  .setup-hand { display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap; margin:1rem 0; }
  .setup-hand .board-slot img { cursor:pointer; }
  .setup-hand .board-slot.chosen-active img { outline:3px solid #f8d030; }
  .setup-hand .board-slot.chosen-bench img { outline:3px solid #6890f0; }

  /* ══════════════════ 對戰畫面視覺升級 (2026-08-04) ══════════════════ */

  /* ── 競技場式分區：每側一個玻璃質感的場地面板，牌庫/棄牌堆放在面板邊緣 ── */
  .arena-zone { position:relative; border-radius:18px; margin:0.25rem 0.6rem; padding:0.4rem 0.8rem;
    background:radial-gradient(ellipse at center, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0.01) 70%);
    border:1px solid var(--border); }
  .arena-zone.opp-zone { border-top:2px solid rgba(255,138,101,0.25); }
  .arena-zone.my-zone { border-bottom:2px solid rgba(105,240,174,0.25); }
  .zone-row { display:flex; align-items:center; gap:0.6rem; padding-top:0.3rem; }
  .zone-row .pile-wrap { margin-top:0; }
  .zone-row.opp-row { flex-direction:row; }
  .zone-row.my-row { flex-direction:row-reverse; }
  .zone-battlefield { flex:1; min-width:0; }

  /* 牌庫／棄牌堆：立起來的一疊卡背，數字疊在上面 */
  .pile-stack { width:44px; height:62px; border-radius:6px; position:relative; flex-shrink:0; cursor:default; }
  .pile-stack.discard-pile { cursor:pointer; }
  .pile-stack .pile-card { position:absolute; inset:0; border-radius:6px; border:1px solid rgba(255,255,255,0.18); }
  .pile-stack .pile-card:nth-child(1) { transform:translate(2px,2px); background:#1b2040; }
  .pile-stack .pile-card:nth-child(2) { transform:translate(0,0); background:linear-gradient(135deg,#232a52,#171a35);
    display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
  .pile-stack .pile-count { position:absolute; bottom:-8px; right:-6px; background:#f05030; color:#fff; font-size:0.62rem;
    font-weight:800; border-radius:999px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
  .pile-label { font-size:0.6rem; color:var(--muted); text-align:center; margin-top:2px; }
  .pile-wrap { display:flex; flex-direction:column; align-items:center; gap:0.5rem; }

  /* ── 手牌扇形排列 + 可拖曳橫向捲動 ── */
  .hand-fan-wrap { overflow-x:auto; overflow-y:visible; padding:1.2rem 1rem 0.4rem; cursor:grab; scrollbar-width:none; }
  .hand-fan-wrap::-webkit-scrollbar { display:none; }
  .hand-fan-wrap.dragging { cursor:grabbing; }
  .hand-fan { display:flex; justify-content:center; min-width:min-content; padding:0 1rem; }
  .hand-fan .board-slot { flex-shrink:0; margin:0 -14px; transition:transform 0.15s ease, margin 0.15s ease, z-index 0s;
    transform-origin:bottom center; }
  .hand-fan .board-slot:hover { transform:translateY(-14px) scale(1.08) !important; z-index:50 !important; margin:0 -2px; }
  /* 對手手牌只是張數示意（看不到內容），不需要跟自己手牌一樣大一樣需要懸停操作空間——
     縮小尺寸跟頂部留白，省下的高度讓給場面 */
  .opp-hand-fan-wrap { padding:0.3rem 1rem 0.1rem; }
  .opp-hand-fan .board-slot:hover { transform:none !important; }
  .opp-hand-fan .card-back { width:42px; }
  .card-back { width:76px; aspect-ratio:5/7; border-radius:8px; background:
    repeating-linear-gradient(135deg, #1b2050, #1b2050 6px, #232a5c 6px, #232a5c 12px);
    border:2px solid rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:1.4rem; }

  /* ── 能量區固定在右下角，可拖曳到寶可夢身上附加 ── */
  .energy-zone-dock { position:fixed; right:1rem; bottom:5.5rem; z-index:55; display:flex; flex-direction:column; align-items:center; gap:0.2rem; }
  .energy-zone-dock .energy-zone { width:52px; height:52px; font-size:0.65rem; }
  .energy-zone-dock .energy-zone.has-energy { cursor:grab; }
  .energy-zone-dock .energy-zone.has-energy:active { cursor:grabbing; }
  .energy-zone-label { font-size:0.6rem; color:var(--muted); }

  /* ── PTCG風格能量圖示：色底圓圈+屬性符號，取代原本純色小圓點 ── */
  .energy-icon { width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    font-size:0.72rem; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.35), 0 1px 2px rgba(0,0,0,0.4); }
  .energy-icon.mini { width:14px; height:14px; font-size:0.55rem; }
  .attack-cost .energy-icon { width:16px; height:16px; font-size:0.6rem; }

  /* ── 卡牌詳細資訊側欄 ── */
  .card-detail-panel { position:fixed; top:0; right:-340px; width:320px; height:100%; background:#0c0f24;
    border-left:1px solid var(--border); z-index:80; padding:1.2rem; overflow-y:auto; transition:right 0.25s ease; }
  .card-detail-panel.open { right:0; }
  .detail-close { position:absolute; top:0.7rem; right:0.9rem; background:rgba(255,255,255,0.14); border:1.5px solid rgba(255,255,255,0.4);
    color:var(--text); border-radius:50%; width:34px; height:34px; font-size:1.05rem; line-height:1; cursor:pointer; z-index:1;
    box-shadow:0 2px 8px rgba(0,0,0,0.4); transition:background 0.15s, border-color 0.15s; }
  .detail-close:hover { background:rgba(255,82,82,0.25); border-color:#ff5252; }
  .card-detail-panel img.detail-img { width:100%; border-radius:12px; margin-bottom:0.8rem; }
  .card-detail-panel h3 { font-size:1.1rem; margin-bottom:0.3rem; }
  .card-detail-panel .detail-meta { color:var(--muted); font-size:0.78rem; margin-bottom:0.8rem; }
  .card-detail-panel .detail-attack { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:0.6rem; margin-bottom:0.5rem; font-size:0.8rem; }
  .card-detail-panel .detail-attack .dname { font-weight:700; display:flex; justify-content:space-between; }
  .card-detail-panel .detail-effect { color:var(--muted); font-size:0.75rem; margin-top:0.3rem; line-height:1.4; }
  .board-slot img.zoomable, .hand-fan img { cursor:pointer; }

  /* ── 屬性攻擊特效層 ── */
  .vfx-layer { position:fixed; inset:0; z-index:65; pointer-events:none; }
  .vfx-bolt { position:absolute; width:22px; height:22px; border-radius:50%; opacity:0; filter:blur(1px) drop-shadow(0 0 8px currentColor); }
  @keyframes vfxFly { 0% { opacity:0; } 8% { opacity:1; } 80% { opacity:1; } 100% { opacity:0; } }
  .vfx-impact { position:absolute; width:70px; height:70px; border-radius:50%; opacity:0; transform:translate(-50%,-50%) scale(0.3);
    background:radial-gradient(circle, currentColor 0%, transparent 70%); }
  @keyframes vfxImpact { 0% { opacity:0; transform:translate(-50%,-50%) scale(0.3); } 30% { opacity:0.85; transform:translate(-50%,-50%) scale(1.3); } 100% { opacity:0; transform:translate(-50%,-50%) scale(1.6); } }

  /* ── 上場特效（2026-08-05補上，跟pokemon_battle.html的spawnSummonEffect同一套手法）：
     寶可夢變成主戰時在卡片上疊一圈屬性色擴散環+粒子爆發。板凳上場（bench_play）不觸發，
     只有「變成主戰」才算——跟主戰場doAttack那邊的定義一致 ── */
  .summon-ring { position:absolute; left:50%; top:50%; width:70px; height:70px; margin:-35px;
    border-radius:50%; border-style:solid; border-width:3px; pointer-events:none; z-index:12;
    animation:summonRingPulse 0.55s ease-out forwards; }
  @keyframes summonRingPulse { 0% { transform:scale(0.3); opacity:0.85; } 100% { transform:scale(2.2); opacity:0; } }
  .summon-particle { position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px;
    border-radius:50%; pointer-events:none; z-index:12; animation:summonParticleFly 0.6s ease-out forwards; }
  @keyframes summonParticleFly { 0% { transform:translate(0,0) scale(1); opacity:1; } 100% { transform:translate(var(--mpx), var(--mpy)) scale(0.2); opacity:0; } }

  /* ── 擲硬幣動畫——2026-08版改成看起來像真的金屬硬幣（純CSS，沒有用任何圖檔/官方素材）：
     金色漸層做出立體感、內圈壓花邊框模擬硬幣的凸緣、正反面用不同底色區分 ── */
  .coin-flip-overlay { position:fixed; inset:0; z-index:95; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; gap:0.8rem; }
  .coin { width:68px; height:68px; border-radius:50%; position:relative;
    background:radial-gradient(circle at 34% 28%, #fff6d5 0%, #f8d030 32%, #d99a1a 68%, #9a6a10 100%);
    border:3px solid #c9931a;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:1.35rem; color:#6b4a0c; text-shadow:0 1px 0 rgba(255,255,255,0.5);
    box-shadow:0 4px 20px rgba(248,208,48,0.45), inset 0 2px 5px rgba(255,255,255,0.65), inset 0 -4px 7px rgba(0,0,0,0.28);
    animation:coinSpin 0.55s ease-in-out; }
  .coin::before { content:''; position:absolute; inset:7px; border-radius:50%; border:1.5px dashed rgba(107,74,12,0.4); }
  .coin.tails { background:radial-gradient(circle at 34% 28%, #f5f5f5 0%, #cfd4dc 32%, #9aa3af 68%, #6b7280 100%); border-color:#7c8390; color:#33383f; }
  @keyframes coinSpin { 0% { transform:rotateY(0deg) scale(0.6); opacity:0; } 50% { transform:rotateY(720deg) scale(1.15); } 100% { transform:rotateY(1080deg) scale(1); opacity:1; } }

  /* ── 傷害飄字 + 受擊震動 ── */
  .dmg-float { position:fixed; z-index:66; font-weight:900; font-size:1.4rem; color:#ff5252; text-shadow:0 2px 6px rgba(0,0,0,0.6);
    pointer-events:none; animation:dmgFloat 1s ease-out forwards; }
  @keyframes dmgFloat { 0% { opacity:0; transform:translate(-50%,0); } 15% { opacity:1; transform:translate(-50%,-10px); } 100% { opacity:0; transform:translate(-50%,-55px); } }
  @keyframes shakeHit { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-6px); } 40% { transform:translateX(5px); } 60% { transform:translateX(-4px); } 80% { transform:translateX(3px); } }
  .board-slot.hit-shake img { animation:shakeHit 0.4s ease; }
  .board-slot.hit-flash img { box-shadow:0 0 0 3px #ff5252; }

  /* ── 狀態/增益小圖示 ── */
  .status-badges { display:flex; gap:2px; justify-content:center; flex-wrap:wrap; margin-top:2px; }
  .status-chip { font-size:0.6rem; background:rgba(255,255,255,0.1); border-radius:4px; padding:0 3px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="page">
  <header class="top">
    <div>
      <h1>Pokémon TCG Pocket 對戰</h1>
      <div class="sub">組牌 — 精選 A1 創世紀卡池</div>
    </div>
    <div class="sub" id="pack-info">載入卡池中...</div>
  </header>

  <div class="layout">
    <div class="pool">
      <div class="filters">
        <input id="q" placeholder="搜尋卡名..." />
        <select id="cat">
          <option value="">全部類別</option>
          <option value="Pokemon">寶可夢</option>
          <option value="Trainer">訓練師</option>
        </select>
        <select id="type">
          <option value="">全部屬性</option>
        </select>
      </div>
      <div class="pool-count" id="pool-count"></div>
      <div class="grid" id="grid"></div>
    </div>

    <aside class="deck-panel">
      <div class="deck-count">牌組 <span id="deck-total">0</span> / 20</div>
      <div class="deck-warn" id="deck-warn"></div>
      <div class="deck-list" id="deck-list"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="clearDeck()">清空</button>
        <button class="btn btn-primary" id="save-btn" onclick="saveDeck()">儲存牌組</button>
      </div>
      <button class="btn btn-secondary" id="goto-lobby-btn" onclick="openLobby()" disabled style="width:100%">🔗 前往連線對戰</button>
    </aside>
  </div>
</div>

<div class="save-toast" id="save-toast">牌組已儲存</div>

<div class="lobby-overlay" id="lobby-overlay">
  <div class="lobby-box">
    <button class="lobby-close" onclick="closeLobby()">✕</button>

    <div id="lobby-step-choose">
      <h2>連線對戰</h2>
      <p class="lobby-sub">牌組已儲存（20張），可以建立房間或輸入房號加入</p>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="createRoom()">建立房間</button>
      </div>
      <div class="join-row">
        <input id="join-code-input" maxlength="4" placeholder="輸入4碼房號">
        <button class="btn btn-secondary" onclick="joinRoom()">加入</button>
      </div>
      <div class="lobby-error" id="lobby-error"></div>
    </div>

    <div id="lobby-step-waiting" style="display:none">
      <h2>房間代碼</h2>
      <div class="room-code" id="room-code-display"></div>
      <p class="lobby-sub">請把房號給對方，等待加入中...</p>
    </div>

    <div id="lobby-step-ready" style="display:none">
      <h2>雙方已連線</h2>
      <p class="lobby-sub" id="ready-status">已送出牌組，等待對手...</p>
    </div>

    <div id="lobby-step-started" style="display:none">
      <h2>對戰開始！</h2>
      <p class="lobby-sub" id="started-status"></p>
    </div>
  </div>
</div>

<div class="board-overlay" id="board-overlay">
  <div class="board-top-bar">
    <div class="turn-indicator" id="turn-indicator"></div>
    <div class="points-row">
      <span class="points-side" id="my-points-side">你 <b id="my-points">0</b><span class="point-markers" id="my-points-markers"></span></span>
      <span class="points-side" id="opp-points-side">對手 <b id="opp-points">0</b><span class="point-markers" id="opp-points-markers"></span></span>
    </div>
  </div>

  <div class="arena-zone opp-zone">
    <div class="hand-fan-wrap opp-hand-fan-wrap"><div class="hand-fan opp-hand-fan" id="opp-hand-fan"></div></div>
    <div class="zone-row opp-row">
      <div class="pile-wrap">
        <div class="pile-stack deck-pile" title="對手牌庫"><div class="pile-card"></div><div class="pile-card">🂠</div><div class="pile-count" id="opp-deck-count">0</div></div>
        <div class="pile-label">牌庫</div>
      </div>
      <div class="zone-battlefield">
        <div class="field-row">
          <div class="bench-row" id="opp-bench"></div>
          <div class="active-row" id="opp-active"></div>
        </div>
      </div>
      <div class="pile-wrap">
        <div class="pile-stack discard-pile" id="opp-discard-pile" title="點擊查看對手棄牌堆"><div class="pile-card"></div><div class="pile-card">🗑️</div><div class="pile-count" id="opp-discard-count">0</div></div>
        <div class="pile-label">棄牌堆</div>
      </div>
    </div>
  </div>

  <div class="mid-area">
    <div class="action-hint" id="action-hint"></div>
  </div>

  <div class="arena-zone my-zone">
    <div class="zone-row my-row">
      <div class="pile-wrap">
        <div class="pile-stack deck-pile" title="我的牌庫"><div class="pile-card"></div><div class="pile-card">🂠</div><div class="pile-count" id="my-deck-count">0</div></div>
        <div class="pile-label">牌庫</div>
      </div>
      <div class="zone-battlefield">
        <div class="field-row">
          <div class="active-row" id="my-active"></div>
          <div class="bench-row" id="my-bench"></div>
        </div>
      </div>
      <div class="pile-wrap">
        <div class="pile-stack discard-pile" id="my-discard-pile" title="點擊查看我的棄牌堆"><div class="pile-card"></div><div class="pile-card">🗑️</div><div class="pile-count" id="my-discard-count">0</div></div>
        <div class="pile-label">棄牌堆</div>
      </div>
    </div>
    <div class="action-bar">
      <div class="attack-row" id="attack-row"></div>
      <div class="turn-controls">
        <button class="btn btn-secondary" id="cancel-action-btn" onclick="cancelAction()" style="display:none">取消</button>
        <button class="btn btn-primary" id="end-turn-btn" onclick="endTurn()">結束回合</button>
      </div>
    </div>
    <div class="hand-fan-wrap" id="hand-fan-wrap"><div class="hand-fan hand-row" id="hand-row"></div></div>
  </div>

  <div class="energy-zone-dock">
    <div class="energy-zone" id="energy-zone-chip"></div>
    <div class="energy-zone-label">能量區</div>
  </div>

  <div class="card-detail-panel" id="card-detail-panel">
    <button class="detail-close" onclick="closeCardDetail()">✕</button>
    <div id="card-detail-body"></div>
  </div>

  <div class="vfx-layer" id="vfx-layer"></div>

  <div class="coin-flip-overlay" id="coin-flip-overlay" style="display:none">
    <div class="coin-flip-coins" id="coin-flip-coins"></div>
  </div>

  <div class="setup-overlay" id="setup-overlay">
    <div class="setup-box">
      <h2>選擇出戰寶可夢</h2>
      <p class="lobby-sub">先點1隻<b>基礎寶可夢</b>當主戰，可以再點最多3隻放板凳</p>
      <div class="setup-hand" id="setup-hand"></div>
      <p class="lobby-sub" id="setup-picks-label"></p>
      <button class="btn btn-primary" id="setup-confirm-btn" onclick="confirmSetup()" disabled>確認出戰</button>
    </div>
  </div>

  <div class="setup-overlay" id="setup-wait-overlay" style="display:none">
    <div class="setup-box"><h2>已送出出戰名單</h2><p class="lobby-sub">等待對手選擇中...</p></div>
  </div>

  <div class="setup-overlay" id="switch-overlay" style="display:none">
    <div class="setup-box">
      <h2 id="switch-title">選擇新的主戰寶可夢</h2>
      <div class="setup-hand" id="switch-choices"></div>
    </div>
  </div>

  <div class="setup-overlay" id="switch-wait-overlay" style="display:none">
    <div class="setup-box"><h2>對手的寶可夢倒下了</h2><p class="lobby-sub">等待對方選擇替補寶可夢中...</p></div>
  </div>

  <div class="setup-overlay" id="gameover-overlay" style="display:none">
    <div class="setup-box">
      <h2 id="gameover-title"></h2>
      <button class="btn btn-secondary" onclick="location.reload()">回到組牌</button>
    </div>
  </div>

  <div class="peek-overlay" id="peek-overlay" style="display:none">
    <div class="peek-box">
      <h2 id="peek-title"></h2>
      <div class="peek-list" id="peek-list"></div>
      <button class="btn btn-secondary" onclick="closePeek()">關閉</button>
    </div>
  </div>
</div>

<script>
/* ─────────────────────────────────────────
   STAR CANVAS
───────────────────────────────────────── */
(function(){
  const cvs = document.getElementById('stars');
  const ctx = cvs.getContext('2d');
  let stars = [];
  function resize(){
    cvs.width=innerWidth; cvs.height=innerHeight;
    stars=Array.from({length:130},()=>({x:Math.random()*cvs.width,y:Math.random()*cvs.height,r:Math.random()*1.3+0.2,a:Math.random(),da:(Math.random()-0.5)*0.007}));
  }
  function draw(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    for(const s of stars){s.a+=s.da;if(s.a<=0.05||s.a>=1)s.da=-s.da;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.a.toFixed(2)})`;ctx.fill();}
    requestAnimationFrame(draw);
  }
  resize(); draw(); addEventListener('resize',resize);
})();

/* ─────────────────────────────────────────
   Deck builder
───────────────────────────────────────── */
const TYPE_COLOR = {
  Fire:'#f08030', Water:'#6890f0', Lightning:'#f8d030', Psychic:'#f85888',
  Fighting:'#c03028', Darkness:'#705848', Dragon:'#7038f8', Colorless:'#a8a878', Grass:'#78c850'
};
const TYPE_ZH = {
  Fire:'火', Water:'水', Lightning:'電', Psychic:'超能力',
  Fighting:'格鬥', Darkness:'惡', Dragon:'龍', Colorless:'無色', Grass:'草'
};
// 自製能量圖示（不是官方PTCG圖檔——那是任天堂/Creatures的版權美術，這個專案一貫不直接使用
// 官方遊戲素材，比照8-bit音效用合成取代真實音檔的原則），色底圓圈+emoji符號，看得出屬性就好
const TYPE_ICON = {
  Fire:'🔥', Water:'💧', Lightning:'⚡', Psychic:'🔮',
  Fighting:'👊', Darkness:'🌑', Dragon:'🐉', Colorless:'⭐', Grass:'🌿'
};
function energyIconHtml(type, mini) {
  return `<span class="energy-icon${mini ? ' mini' : ''}" style="background:${TYPE_COLOR[type] || '#888'}" title="${TYPE_ZH[type] || type}">${TYPE_ICON[type] || '?'}</span>`;
}
const DECK_KEY = 'pocketDeck';
const DECK_SIZE = 20;
const MAX_COPIES = 2;

let ALL_CARDS = [];
let cardById = {};
/** deck: array of card ids (each entry = 1 copy) */
let deck = [];

async function loadCards() {
  const res = await fetch('pocket-cards.json');
  const data = await res.json();
  ALL_CARDS = data.cards;
  ALL_CARDS.forEach(c => cardById[c.id] = c);
  document.getElementById('pack-info').textContent = `卡池 ${ALL_CARDS.length} 張`;

  const typeSet = new Set();
  ALL_CARDS.forEach(c => (c.types || []).forEach(t => typeSet.add(t)));
  const typeSel = document.getElementById('type');
  [...typeSet].sort().forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = TYPE_ZH[t] || t;
    typeSel.appendChild(o);
  });

  const saved = JSON.parse(localStorage.getItem(DECK_KEY) || '[]');
  deck = saved.filter(id => cardById[id]);

  renderPool();
  renderDeck();
}

function countInDeck(id) {
  return deck.filter(x => x === id).length;
}

function addCard(id) {
  const card = cardById[id];
  if (!card) return;
  if (deck.length >= DECK_SIZE) return;
  if (countInDeck(id) >= MAX_COPIES) return;
  deck.push(id);
  renderPool();
  renderDeck();
}

function removeCard(id) {
  const idx = deck.lastIndexOf(id);
  if (idx >= 0) deck.splice(idx, 1);
  renderPool();
  renderDeck();
}

function clearDeck() {
  deck = [];
  renderPool();
  renderDeck();
}

function saveDeck() {
  localStorage.setItem(DECK_KEY, JSON.stringify(deck));
  const toast = document.getElementById('save-toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1400);
}

function deckValidation() {
  const total = deck.length;
  const hasBasic = deck.some(id => {
    const c = cardById[id];
    return c && c.category === 'Pokemon' && c.stage === 'Basic';
  });
  const problems = [];
  if (total !== DECK_SIZE) problems.push(`需要剛好 ${DECK_SIZE} 張（目前 ${total} 張）`);
  if (!hasBasic) problems.push('至少需要 1 張基礎寶可夢');
  return { total, hasBasic, valid: problems.length === 0, problems };
}

function renderPool() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const cat = document.getElementById('cat').value;
  const type = document.getElementById('type').value;
  const filtered = ALL_CARDS.filter(c => {
    if (q && !c.name.toLowerCase().includes(q)) return false;
    if (cat && c.category !== cat) return false;
    if (type && !(c.types || []).includes(type)) return false;
    return true;
  });
  document.getElementById('pool-count').textContent = `顯示 ${filtered.length} / ${ALL_CARDS.length} 張`;

  const grid = document.getElementById('grid');
  grid.innerHTML = filtered.map(c => {
    const n = countInDeck(c.id);
    const maxed = n >= MAX_COPIES || deck.length >= DECK_SIZE;
    const typeDots = (c.types || []).map(t => `<span class="type-dot" style="background:${TYPE_COLOR[t] || '#888'}"></span>`).join('');
    const metaLine = c.category === 'Pokemon'
      ? `${typeDots}${TYPE_ZH[c.types?.[0]] || ''} · ${c.stage === 'Basic' ? '基礎' : c.stage === 'Stage1' ? '第1階' : '第2階'}${c.ex ? ' · EX' : ''} · HP${c.hp}`
      : c.trainerType === 'Supporter' ? '支援者卡' : '道具卡';
    return `
      <div class="card-tile ${maxed && n < MAX_COPIES ? 'maxed' : ''}" onclick="addCard('${c.id}')" title="${maxed ? '已達上限或牌組已滿' : '點擊加入牌組'}">
        ${n > 0 ? `<div class="count-badge">${n}</div>` : ''}
        <img src="${c.image}" loading="lazy" alt="${c.name}">
        <div class="name">${c.name}</div>
        <div class="meta">${metaLine}</div>
      </div>`;
  }).join('');
}

function renderDeck() {
  const v = deckValidation();
  document.getElementById('deck-total').innerHTML = `<span class="${v.total === DECK_SIZE ? 'ok' : 'bad'}">${v.total}</span>`;
  const warn = document.getElementById('deck-warn');
  if (v.problems.length) {
    warn.textContent = v.problems.join('　·　');
    warn.classList.add('show');
  } else {
    warn.classList.remove('show');
  }
  document.getElementById('save-btn').disabled = !v.valid;
  document.getElementById('goto-lobby-btn').disabled = !v.valid;

  // group by id, preserve first-seen order
  const groups = [];
  const seen = {};
  deck.forEach(id => {
    if (!(id in seen)) { seen[id] = groups.length; groups.push({ id, count: 0 }); }
    groups[seen[id]].count++;
  });

  const list = document.getElementById('deck-list');
  if (!groups.length) {
    list.innerHTML = '<div class="deck-empty">從左邊卡池點擊卡片加入牌組</div>';
    return;
  }
  list.innerHTML = groups.map(g => {
    const c = cardById[g.id];
    return `
      <div class="deck-row">
        <img src="${c.image}" alt="${c.name}">
        <div class="n">${c.name}</div>
        <div class="x">×${g.count}</div>
        <button onclick="removeCard('${g.id}')">−</button>
      </div>`;
  }).join('');
}

['q', 'cat', 'type'].forEach(id => document.getElementById(id).addEventListener('input', renderPool));

loadCards();

/* ─────────────────────────────────────────
   Lobby / WS connection
───────────────────────────────────────── */
let ws = null;
let myRole = null; // 'p1' | 'p2'
let lastMyPoints = 0, lastOppPoints = 0; // 用來判斷分數是否剛好在這次render增加，觸發標記彈跳動畫
let lastMyActiveUid = null, lastOppActiveUid = null; // 用來判斷主戰是不是剛好換了一隻新的，觸發上場特效

function lobbyShowStep(step) {
  ['choose', 'waiting', 'ready', 'started'].forEach(s => {
    document.getElementById(`lobby-step-${s}`).style.display = s === step ? '' : 'none';
  });
}

function openLobby() {
  if (deckValidation().valid !== true) return;
  document.getElementById('lobby-overlay').classList.add('open');
  lobbyShowStep('choose');
  document.getElementById('lobby-error').textContent = '';
  connectWs();
}

function closeLobby() {
  document.getElementById('lobby-overlay').classList.remove('open');
  if (ws) { ws.close(); ws = null; }
}

function connectWs() {
  if (ws) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onmessage = e => handleWsMsg(JSON.parse(e.data));
  ws.onclose = () => { ws = null; };
}

function wsSend(msg) {
  if (ws?.readyState === 1) ws.send(JSON.stringify(msg));
  else if (ws) ws.addEventListener('open', () => ws.send(JSON.stringify(msg)), { once: true });
}

function createRoom() {
  wsSend({ type: 'pocket_create_room' });
}

function joinRoom() {
  const code = document.getElementById('join-code-input').value.trim();
  if (!code) return;
  wsSend({ type: 'pocket_join_room', code });
}

function handleWsMsg(msg) {
  switch (msg.type) {
    case 'pocket_room_created':
      myRole = msg.role;
      document.getElementById('room-code-display').textContent = msg.code;
      lobbyShowStep('waiting');
      break;
    case 'pocket_joined':
      myRole = msg.role;
      wsSend({ type: 'pocket_submit_deck', deck });
      lobbyShowStep('ready');
      document.getElementById('ready-status').textContent = '已送出牌組，等待對手...';
      break;
    case 'pocket_opponent_joined':
      wsSend({ type: 'pocket_submit_deck', deck });
      lobbyShowStep('ready');
      document.getElementById('ready-status').textContent = '對手已加入，已送出牌組，等待對手送出...';
      break;
    case 'pocket_opponent_ready':
      document.getElementById('ready-status').textContent = '對手已送出牌組，等待對戰開始...';
      break;
    case 'pocket_match_start': {
      const iAmFirst = msg.firstPlayer === myRole;
      lobbyShowStep('started');
      document.getElementById('started-status').textContent = `先攻：${iAmFirst ? '你' : '對手'}`;
      setTimeout(() => {
        document.getElementById('lobby-overlay').classList.remove('open');
        document.getElementById('board-overlay').classList.add('open');
        applyState(msg);
      }, 900);
      break;
    }
    case 'pocket_turn_state':
      applyState(msg);
      break;
    case 'pocket_peek':
      showPeek(msg.title, msg.cards);
      break;
    case 'pocket_opponent_disconnected':
      document.getElementById('lobby-error').textContent = '對手已離線';
      flashActionHint('對手已離線');
      break;
    case 'error':
      document.getElementById('lobby-error').textContent = msg.message || '發生錯誤';
      if (msg.message) flashActionHint(msg.message);
      break;
  }
}

/* ─────────────────────────────────────────

───────────────────────────────────────── */
let state = null; // 最新一份 pocket_turn_state / pocket_match_start
let selectedAction = null; // null | {mode:'attach'} | {mode:'evolve', handUid, from} | {mode:'retreat'}

function applyState(msg) {
  state = msg;
  selectedAction = null;
  renderBoard();
}

function typeDots(types) {
  return (types || []).map(t => `<span class="type-dot" style="background:${TYPE_COLOR[t] || '#888'}"></span>`).join('');
}

// 卡牌詳細資訊側欄——遊玩中場上/手牌的card物件uid是動態產生的實例id，找不到就退回卡池的靜態資料
// （沒有uid的情況：組牌畫面點卡片、或peek彈窗裡的卡片，直接把整包card物件傳進來就好）
function pocketFindCardByUid(uid) {
  if (!state) return null;
  const pools = [state.you?.active, ...(state.you?.bench || []), ...(state.you?.hand || []),
    state.opponent?.active, ...(state.opponent?.bench || [])];
  return pools.find(c => c && c.uid === uid) || null;
}
// actions（可選）：[{label, primary, disabled, onClick}] ——2026-08-05新增，讓卡片預覽面板
// 兼任「點卡→看到能做什麼→確認」的操作入口，取代原本手牌/場上寶可夢單擊直接觸發動作
// （沒有預覽、容易誤觸）的舊行為。純檢視用途（例如查看對手的卡）不傳actions就跟以前一樣。
function showCardDetail(card, actions) {
  if (!card) return;
  const body = document.getElementById('card-detail-body');
  const isPoke = card.category === 'Pokemon';
  let html = `<img class="detail-img" src="${card.image}" alt="${card.name}">
    <h3>${card.name}${card.ex ? ' EX' : ''}</h3>
    <div class="detail-meta">${card.rarity || ''}${isPoke ? ` · ${card.stage === 'Basic' ? '基礎' : card.stage} · HP ${card.hp}` : ` · ${card.trainerType === 'Supporter' ? '支援者卡' : '道具卡'}`}</div>`;
  if (isPoke) {
    html += (card.attacks || []).map(a => `
      <div class="detail-attack">
        <div class="dname"><span>${a.name}</span><span>${(a.cost || []).map(t => energyIconHtml(t, true)).join('')} ${a.damage || ''}</span></div>
        ${a.effect ? `<div class="detail-effect">${a.effect}</div>` : ''}
      </div>`).join('');
    if (card.abilities?.length) html += card.abilities.map(ab => `<div class="detail-attack"><div class="dname">特性：${ab.name}</div><div class="detail-effect">${ab.effect}</div></div>`).join('');
    if (card.weaknesses?.length) html += `<div class="detail-meta">弱點：${card.weaknesses.map(w => (TYPE_ZH[w.type] || w.type) + w.value).join(', ')}${card.retreat != null ? ` · 撤退 ${card.retreat}` : ' · 無法撤退'}</div>`;
  } else {
    html += `<div class="detail-effect">${card.effect || ''}</div>`;
  }
  window.__detailActions = actions || [];
  if (actions && actions.length) {
    html += `<div class="detail-actions">` + actions.map((a, i) =>
      `<button class="btn ${a.primary ? 'btn-primary' : 'btn-secondary'}" ${a.disabled ? 'disabled' : ''} onclick="pocketDetailAction(${i})">${a.label}</button>`
    ).join('') + `</div>`;
  }
  body.innerHTML = html;
  document.getElementById('card-detail-panel').classList.add('open');
}
function pocketDetailAction(i) {
  const a = window.__detailActions?.[i];
  if (!a || a.disabled) return;
  closeCardDetail();
  a.onClick();
}
function closeCardDetail() { document.getElementById('card-detail-panel').classList.remove('open'); }

const STATUS_LABEL = { asleep: '😴 睡眠', poisoned: '☠️ 中毒', paralyzed: '⚡ 麻痺' };
function renderPokeSlot(p, { pickable = false, dataset = {}, own = false } = {}) {
  if (!p) return '<div class="board-slot empty"></div>';
  const hpPct = p.hp ? Math.max(0, Math.round(((p.curHp ?? p.hp) / p.hp) * 100)) : 100;
  const energyIcons = (p.energy || []).map(e => energyIconHtml(e, true)).join('');
  const attrs = Object.entries(dataset).map(([k, v]) => `data-${k}="${v}"`).join(' ');
  const badges = [];
  if (p.status) badges.push(`<span class="status-chip">${STATUS_LABEL[p.status] || p.status}</span>`);
  const tn = state?.turnNumber ?? 0;
  if (p.cantAttackUntilTurn === tn) badges.push(`<span class="status-chip" title="這回合不能攻擊">🚫⚔</span>`);
  if (p.cantRetreatUntilTurn === tn) badges.push(`<span class="status-chip" title="這回合不能撤退">🚫🔄</span>`);
  if (p.dmgDebuffUntilTurn === tn) badges.push(`<span class="status-chip" title="這回合攻擊傷害-${p.dmgDebuffAmount}">↓${p.dmgDebuffAmount}</span>`);
  const statusHtml = badges.length ? `<div class="status-badges">${badges.join('')}</div>` : '';
  // own卡片的🔍要跟直接點卡片本體一樣帶出可用動作（撤退/附加能量），不然點🔍看到的畫面
  // 反而比點卡片本身少了按鈕，兩個入口行為不一致會讓人以為🔍是唯讀、卡片本體才有功能
  const detailCall = own ? `showCardDetail(pocketFindCardByUid('${p.uid}'), computeOwnBoardActions(pocketFindCardByUid('${p.uid}')))` : `showCardDetail(pocketFindCardByUid('${p.uid}'))`;
  let extraBtns = `<button class="mini-btn" onclick="event.stopPropagation();${detailCall}" title="查看詳細資訊">🔍</button>`;
  if (own && state?.turn === myRole && state.phase === 'active') {
    const ability = p.abilities?.[0];
    if (ability && ABILITY_NAMES_SUPPORTED.has(ability.name) && !state.you.abilitiesUsedThisTurn.includes(p.uid)) {
      extraBtns += `<button class="mini-btn" data-ability-uid="${p.uid}" title="${ability.name}">特性</button>`;
    }
    if (p.isFossil) extraBtns += `<button class="mini-btn" data-fossil-uid="${p.uid}">棄置</button>`;
  }
  return `
    <div class="board-slot ${pickable ? 'pickable' : ''}" data-uid="${p.uid}" ${attrs}>
      <img src="${p.image}" alt="${p.name}">
      <div class="board-name">${p.name}${p.ex ? ' EX' : ''}</div>
      <div class="hp-bar"><div class="hp-fill ${hpPct <= 30 ? 'low' : ''}" style="width:${hpPct}%"></div></div>
      <div>${p.curHp ?? p.hp}/${p.hp}</div>
      <div class="energy-row">${energyIcons}</div>
      ${statusHtml}
      ${extraBtns}
    </div>`;
}
const ABILITY_NAMES_SUPPORTED = new Set(['Volt Charge', 'Sleep Pendulum', 'Psy Shadow', 'Gas Leak']);

function renderBoard() {
  if (!state) return;
  const { you, opponent, turn, turnNumber, phase, pendingSwitchRole } = state;
  const myTurn = turn === myRole;

  document.getElementById('turn-indicator').textContent = phase === 'done' ? '對戰結束' : `第 ${turnNumber} 回合 · ${myTurn ? '輪到你' : '對手回合'}`;
  document.getElementById('my-points').textContent = you.points;
  document.getElementById('opp-points').textContent = opponent.points;
  renderPointMarkers('my', you.points, lastMyPoints);
  renderPointMarkers('opp', opponent.points, lastOppPoints);
  lastMyPoints = you.points; lastOppPoints = opponent.points;
  document.getElementById('opp-deck-count').textContent = opponent.deckCount;
  document.getElementById('my-deck-count').textContent = you.deckCount;
  document.getElementById('opp-discard-count').textContent = (opponent.discard || []).length;
  document.getElementById('my-discard-count').textContent = (you.discard || []).length;

  // 對手手牌視覺化：不知道內容，用蓋牌背面呈現張數(扇形排列)——只露出張數不露內容
  const oppHandFan = document.getElementById('opp-hand-fan');
  oppHandFan.innerHTML = Array.from({ length: opponent.handCount || 0 }, () => '<div class="card-back">🎴</div>').join('');
  applyFanLayout(oppHandFan);

  const oppActiveEl = document.getElementById('opp-active');
  oppActiveEl.innerHTML = renderPokeSlot(opponent.active);
  document.getElementById('opp-bench').innerHTML = (opponent.bench || []).map(p => renderPokeSlot(p)).join('') || '<div class="board-slot empty"></div>'.repeat(3);
  const myActiveEl = document.getElementById('my-active');
  myActiveEl.innerHTML = renderPokeSlot(you.active, {
    pickable: !!selectedAction && selectedAction.mode !== 'retreat',
    dataset: { zone: 'active' },
    own: true,
  });
  // 上場特效：只在「主戰真的換了一隻新的」時觸發（uid變了且新主戰存在），不是每次state
  // 廣播都放——HP/能量變化也會走到這裡重繪，不能靠「有沒有畫面」判斷，要比對uid
  if (opponent.active && opponent.active.uid !== lastOppActiveUid) spawnSummonEffect(oppActiveEl.querySelector('.board-slot'), opponent.active.types?.[0]);
  if (you.active && you.active.uid !== lastMyActiveUid) spawnSummonEffect(myActiveEl.querySelector('.board-slot'), you.active.types?.[0]);
  lastOppActiveUid = opponent.active?.uid || null;
  lastMyActiveUid = you.active?.uid || null;
  document.getElementById('my-bench').innerHTML = (you.bench || []).map(p => renderPokeSlot(p, {
    pickable: !!selectedAction,
    dataset: { zone: 'bench' },
    own: true,
  })).join('');

  // energy zone chip——可以點擊進入「選目標」模式，也可以直接拖到寶可夢身上放開來附加（見底下的drag/drop）
  const chip = document.getElementById('energy-zone-chip');
  if (you.pendingEnergy && !you.energyAttachedThisTurn && myTurn) {
    chip.className = `energy-zone has-energy ${selectedAction?.mode === 'attach' ? 'picking' : ''}`;
    chip.style.background = TYPE_COLOR[you.pendingEnergy] || '#888';
    chip.textContent = TYPE_ICON[you.pendingEnergy] || '?';
    chip.draggable = true;
    chip.title = `點擊或拖曳到寶可夢身上，附加 ${TYPE_ZH[you.pendingEnergy] || you.pendingEnergy} 能量`;
    chip.onclick = () => {
      if (!myTurn) return;
      selectedAction = selectedAction?.mode === 'attach' ? null : { mode: 'attach' };
      updateActionHint();
      renderBoard();
    };
  } else {
    chip.className = 'energy-zone';
    chip.textContent = you.energyAttachedThisTurn ? '✓' : '—';
    chip.draggable = false;
    chip.onclick = null;
    chip.style.background = 'transparent';
  }

  // attack buttons
  const atkRow = document.getElementById('attack-row');
  if (you.active && myTurn && phase === 'active') {
    atkRow.innerHTML = (you.active.attacks || []).map((a, i) => {
      const affordable = pocketCanPayCostClient(you.active, a.cost);
      const costHtml = (a.cost || []).map(t => energyIconHtml(t)).join('');
      return `<button class="attack-btn" ${affordable ? '' : 'disabled'} onclick="doAttack(${i})">
        <span>${a.name}</span>
        <span class="attack-cost">${costHtml}</span>
        <span>${a.damage || '-'}</span>
      </button>`;
    }).join('') || '<div class="lobby-sub">這隻寶可夢沒有招式</div>';
  } else {
    atkRow.innerHTML = '';
  }

  document.getElementById('end-turn-btn').style.display = myTurn && phase === 'active' ? '' : 'none';
  document.getElementById('cancel-action-btn').style.display = selectedAction ? '' : 'none';

  // hand row
  const handRow = document.getElementById('hand-row');
  handRow.innerHTML = (you.hand || []).map(c => {
    const label = c.category === 'Pokemon' ? `${c.stage === 'Basic' ? '基礎' : c.stage === 'Stage1' ? '第1階' : '第2階'}` : (c.trainerType === 'Supporter' ? '支援者' : '道具');
    const locked = c.trainerType === 'Supporter' && you.supporterUsedThisTurn;
    return `<div class="board-slot ${locked ? 'maxed' : ''}" data-hand-uid="${c.uid}" data-hand-kind="${c.category}">
      <img src="${c.image}" alt="${c.name}">
      <div class="board-name">${c.name}</div>
      <div>${label}</div>
      <button class="mini-btn" onclick="event.stopPropagation();showCardDetail(pocketFindCardByUid('${c.uid}'), computeHandCardActions(pocketFindCardByUid('${c.uid}')))" title="查看詳細資訊">🔍</button>
    </div>`;
  }).join('');
  applyFanLayout(handRow);

  updateActionHint();
  handlePocketEvent(state.lastEvent);

  // setup overlay
  document.getElementById('setup-overlay').style.display = phase === 'setup' && !you.boardSubmitted ? 'flex' : 'none';
  document.getElementById('setup-wait-overlay').style.display = phase === 'setup' && you.boardSubmitted ? 'flex' : 'none';
  if (phase === 'setup' && !you.boardSubmitted) renderSetupHand();

  // forced switch overlay——雙殺時佇列可能兩邊都要換，這裡只顯示「輪到我」還是「輪到對方」，
  // pendingSwitchRole永遠指向佇列最前面那個，另一邊在切到自己之前都顯示等待畫面
  const needMySwitch = phase === 'forced_switch' && pendingSwitchRole === myRole;
  const needOppSwitch = phase === 'forced_switch' && pendingSwitchRole !== myRole;
  document.getElementById('switch-overlay').style.display = needMySwitch ? 'flex' : 'none';
  document.getElementById('switch-wait-overlay').style.display = needOppSwitch ? 'flex' : 'none';
  if (needMySwitch) {
    document.getElementById('switch-choices').innerHTML = (you.bench || []).map(p =>
      renderPokeSlot(p, { pickable: true, dataset: { 'switch-pick': '1' } })
    ).join('');
  }

  if (phase === 'done') showGameOver(state.winner);
  else document.getElementById('gameover-overlay').style.display = 'none';
}

// 短暫顯示一則錯誤/系統訊息（例如server端擋下不合法的操作），跟selectedAction的提示banner
// 共用同一個元素跟樣式，但不是「等待動作」狀態，2秒後如果沒有其他selectedAction就自動清掉，
// 不會一直卡在畫面上
let actionHintFlashTimer = null;
function flashActionHint(text) {
  const hint = document.getElementById('action-hint');
  clearTimeout(actionHintFlashTimer);
  hint.classList.add('active');
  hint.innerHTML = `<span>${text}</span>`;
  actionHintFlashTimer = setTimeout(() => { if (!selectedAction) updateActionHint(); }, 2200);
}

function updateActionHint() {
  const hint = document.getElementById('action-hint');
  if (!selectedAction) { hint.classList.remove('active'); hint.innerHTML = ''; return; }
  let text = '';
  if (selectedAction.mode === 'attach') text = '點擊己方的寶可夢來附加能量';
  else if (selectedAction.mode === 'evolve') text = `點擊要進化成 ${selectedAction.name} 的寶可夢`;
  else if (selectedAction.mode === 'retreat') text = '點擊板凳寶可夢來撤退交換';
  else if (selectedAction.mode === 'item-target') text = '點擊己方場上的寶可夢作為目標';
  hint.classList.add('active');
  hint.innerHTML = `<span>${text}</span><button class="hint-cancel" onclick="cancelAction()">取消</button>`;
}

function cancelAction() { selectedAction = null; renderBoard(); }

function pocketCanPayCostClient(pokemon, cost) {
  const need = {}; let colorlessNeed = 0;
  for (const t of (cost || [])) { if (t === 'Colorless') colorlessNeed++; else need[t] = (need[t] || 0) + 1; }
  const have = {};
  for (const e of (pokemon.energy || [])) have[e] = (have[e] || 0) + 1;
  for (const t in need) { if ((have[t] || 0) < need[t]) return false; have[t] -= need[t]; }
  const leftover = Object.values(have).reduce((a, b) => a + b, 0);
  return leftover >= colorlessNeed;
}

function doAttack(i) { wsSend({ type: 'pocket_attack', attackIndex: i }); }
function endTurn() { wsSend({ type: 'pocket_end_turn' }); }

const POCKET_FOSSIL_IDS = new Set(['A1-216', 'A1-217', 'A1-218']);
const TRAINER_NEEDS_TARGET = new Set(['P-A-001', 'A1-219', 'A1-220']); // Potion / Erika / Misty

// event delegation：own board (active/bench) 點擊
document.getElementById('board-overlay').addEventListener('click', e => {
  const abilityBtn = e.target.closest('[data-ability-uid]');
  if (abilityBtn) { wsSend({ type: 'pocket_use_ability', pokemonUid: abilityBtn.dataset.abilityUid }); return; }
  const fossilBtn = e.target.closest('[data-fossil-uid]');
  if (fossilBtn) { wsSend({ type: 'pocket_discard_fossil', target: fossilBtn.dataset.fossilUid }); return; }

  const slot = e.target.closest('.board-slot[data-uid]');
  if (slot && slot.closest('#my-active, #my-bench') && selectedAction) {
    const uid = slot.dataset.uid;
    if (selectedAction.mode === 'attach') wsSend({ type: 'pocket_attach_energy', target: uid });
    else if (selectedAction.mode === 'evolve') wsSend({ type: 'pocket_evolve', handUid: selectedAction.handUid, target: uid });
    else if (selectedAction.mode === 'retreat' && slot.closest('#my-bench')) wsSend({ type: 'pocket_retreat', target: uid });
    else if (selectedAction.mode === 'item-target') {
      wsSend({ type: selectedAction.isSupporter ? 'pocket_play_supporter' : 'pocket_play_item', handUid: selectedAction.handUid, target: uid });
    }
    selectedAction = null;
    return;
  }
  const switchSlot = e.target.closest('.board-slot[data-switch-pick]');
  if (switchSlot) { wsSend({ type: 'pocket_choose_active', target: switchSlot.dataset.uid }); return; }

  // 2026-08-05改版：點手牌/己方場上寶可夢不再直接觸發動作（原本一點就出牌/撤退，容易誤觸、
  // 也看不到卡片詳細內容才做決定）——改成先開卡片預覽面板，可用的動作變成面板裡的按鈕，
  // 按下去才真的送出，跟真實集換式卡牌遊戲「點卡看詳情→按按鈕確認」的操作習慣一致。
  const handSlot = e.target.closest('.hand-row .board-slot[data-hand-uid]');
  if (handSlot && state && state.turn === myRole && state.phase === 'active') {
    const uid = handSlot.dataset.handUid;
    const card = state.you.hand.find(c => c.uid === uid);
    if (card) showCardDetail(card, computeHandCardActions(card));
    return;
  }

  const ownSlot = e.target.closest('#my-active .board-slot[data-uid], #my-bench .board-slot[data-uid]');
  if (ownSlot && !selectedAction) {
    const card = pocketFindCardByUid(ownSlot.dataset.uid);
    if (card) showCardDetail(card, computeOwnBoardActions(card));
  }
});

// 手牌卡片可用動作——跟原本直接送出的if/else分支邏輯相同，只是包成actions陣列給預覽面板用
function computeHandCardActions(card) {
  if (card.category === 'Pokemon' && card.stage === 'Basic') {
    return [{ label: '上場（加入板凳）', primary: true, onClick: () => wsSend({ type: 'pocket_bench_play', handUid: card.uid }) }];
  }
  if (card.category === 'Pokemon') {
    return [{ label: `選擇要進化成 ${card.name} 的寶可夢`, primary: true, onClick: () => {
      selectedAction = { mode: 'evolve', handUid: card.uid, name: card.name };
      updateActionHint(); renderBoard();
    } }];
  }
  if (card.category === 'Trainer' && POCKET_FOSSIL_IDS.has(card.id)) {
    return [{ label: '上場（化石，可隨時棄置）', primary: true, onClick: () => wsSend({ type: 'pocket_bench_play', handUid: card.uid }) }];
  }
  if (card.category === 'Trainer') {
    const isSupporter = card.trainerType === 'Supporter';
    if (isSupporter && state.you.supporterUsedThisTurn) {
      return [{ label: '這回合已經用過支援者卡了', disabled: true }];
    }
    if (TRAINER_NEEDS_TARGET.has(card.id)) {
      return [{ label: '選擇目標寶可夢', primary: true, onClick: () => {
        selectedAction = { mode: 'item-target', handUid: card.uid, isSupporter };
        updateActionHint(); renderBoard();
      } }];
    }
    return [{ label: isSupporter ? '使用這張支援者卡' : '使用這張道具卡', primary: true, onClick: () =>
      wsSend({ type: isSupporter ? 'pocket_play_supporter' : 'pocket_play_item', handUid: card.uid }) }];
  }
  return [];
}

// 己方場上寶可夢可用動作——撤退原本是「點板凳直接觸發」的隱藏捷徑（容易誤觸浪費這回合僅有
// 一次的撤退機會），現在統一成「點主戰→撤退按鈕→再點板凳完成交換」兩步驟，跟附加能量共用
// 同一套「先選動作再點目標」的既有selectedAction模式（reused，不是新機制）。
function computeOwnBoardActions(card) {
  if (!state || state.turn !== myRole || state.phase !== 'active') return [];
  const you = state.you;
  const actions = [];
  const isActive = you.active?.uid === card.uid;
  if (isActive && !you.retreatedThisTurn && !card.isFossil && card.status !== 'asleep' && card.status !== 'paralyzed'
      && card.cantRetreatUntilTurn !== state.turnNumber && you.bench.length) {
    const cost = Math.max(0, (card.retreat || 0) - (you.retreatDiscountThisTurn || 0));
    const affordable = (card.energy?.length || 0) >= cost;
    actions.push({
      label: `撤退（消耗 ${cost} 點能量）`, primary: true, disabled: !affordable,
      onClick: () => { selectedAction = { mode: 'retreat' }; updateActionHint(); renderBoard(); },
    });
  }
  if (you.pendingEnergy && !you.energyAttachedThisTurn) {
    actions.push({
      label: `附加 ${TYPE_ZH[you.pendingEnergy] || you.pendingEnergy} 能量到這隻`, primary: !actions.length,
      onClick: () => wsSend({ type: 'pocket_attach_energy', target: card.uid }),
    });
  }
  return actions;
}

/* ── setup（開局選主戰/板凳） ── */
let setupActive = null;
let setupBench = [];
function renderSetupHand() {
  const hand = state.you.hand;
  document.getElementById('setup-hand').innerHTML = hand.map(c => {
    const isBasic = c.category === 'Pokemon' && c.stage === 'Basic';
    const cls = c.uid === setupActive ? 'chosen-active' : setupBench.includes(c.uid) ? 'chosen-bench' : '';
    return `<div class="board-slot ${cls}" data-setup-uid="${c.uid}" data-basic="${isBasic}">
      <img src="${c.image}" alt="${c.name}">
      <div class="board-name">${c.name}</div>
      <div>${isBasic ? '基礎' : (c.category === 'Pokemon' ? c.stage : c.trainerType)}</div>
    </div>`;
  }).join('');
  document.getElementById('setup-picks-label').textContent = `主戰：${setupActive ? '已選' : '未選'} · 板凳：${setupBench.length}/3`;
  document.getElementById('setup-confirm-btn').disabled = !setupActive;
}
document.getElementById('setup-hand').addEventListener('click', e => {
  const slot = e.target.closest('.board-slot[data-setup-uid]');
  if (!slot || slot.dataset.basic !== 'true') return;
  const uid = slot.dataset.setupUid;
  if (setupActive === uid) { setupActive = null; }
  else if (setupBench.includes(uid)) { setupBench = setupBench.filter(u => u !== uid); }
  else if (!setupActive) { setupActive = uid; }
  else if (setupBench.length < 3) { setupBench.push(uid); }
  renderSetupHand();
});
function confirmSetup() {
  if (!setupActive) return;
  wsSend({ type: 'pocket_setup_board', active: setupActive, bench: setupBench });
  state.you.boardSubmitted = true;
  renderBoard();
}

function showPeek(title, cards) {
  document.getElementById('peek-title').textContent = title;
  document.getElementById('peek-list').innerHTML = (cards || []).map(c => `
    <div style="text-align:center;font-size:0.65rem">
      <img src="${c.image}" alt="${c.name}"><div>${c.name}</div>
    </div>`).join('') || '<div class="lobby-sub">（沒有卡片）</div>';
  document.getElementById('peek-overlay').style.display = 'flex';
}
function closePeek() { document.getElementById('peek-overlay').style.display = 'none'; }

// 勝負門檻是3分，但單次擊倒ex寶可夢給2分可能一次從1跳到3甚至更多——markers視覺上固定畫3顆，
// 多出來的分數只反映在旁邊的數字上，不會多畫第4顆。
function renderPointMarkers(prefix, points, prevPoints) {
  const el = document.getElementById(`${prefix}-points-markers`);
  const filled = Math.min(points, 3);
  el.innerHTML = Array.from({ length: 3 }, (_, i) =>
    `<span class="point-marker ${i < filled ? 'filled' : ''}"></span>`
  ).join('');
  const sideEl = document.getElementById(`${prefix}-points-side`);
  if (points > prevPoints) {
    sideEl.classList.remove('win-flash'); void sideEl.offsetWidth; sideEl.classList.add('win-flash');
  }
}

function showGameOver(winner) {
  const title = document.getElementById('gameover-title');
  // winner==='draw'：雙方主戰在同一次攻擊中互相擊倒且雙方都沒有板凳可以補位——見server.js的
  // pocketResolveMutualKO，一定要排在winner===myRole/truthy判斷之前，不然'draw'這個truthy字串
  // 會被誤判成「對手獲勝」。
  title.textContent = winner === 'draw' ? '平手！雙方同時倒下' : winner === myRole ? '你獲勝了！' : winner ? '對手獲勝' : '對戰結束';
  document.getElementById('gameover-overlay').style.display = 'flex';
}

/* ─────────────────────────────────────────
   視覺升級（2026-08-04）：手牌扇形、擲硬幣動畫、屬性攻擊特效、傷害飄字、
   能量區拖曳附加、棄牌堆檢視、卡牌詳細資訊（showCardDetail定義在renderPokeSlot附近）
───────────────────────────────────────── */

// 扇形手牌：中間的卡角度接近0，兩側依距離中心的比例往外偏轉+下沉，模擬手持展開的撲克牌手感
function applyFanLayout(container) {
  const cards = [...container.children];
  const n = cards.length;
  if (!n) return;
  const maxAngle = Math.min(30, 6 + n * 2.2);
  cards.forEach((el, i) => {
    const t = n === 1 ? 0 : (i / (n - 1)) - 0.5; // -0.5 .. 0.5
    const angle = t * maxAngle;
    const drop = Math.abs(t) * 16;
    el.style.transform = `rotate(${angle}deg) translateY(${drop}px)`;
    el.style.zIndex = String(i);
  });
}

// 手牌區橫向拖曳捲動（滑鼠版；觸控本來就有原生橫向滑動，overflow-x:auto已經支援）
function enableDragScroll(wrapEl) {
  let isDown = false, startX = 0, startScroll = 0, moved = false;
  wrapEl.addEventListener('mousedown', e => {
    isDown = true; moved = false; wrapEl.classList.add('dragging');
    startX = e.pageX; startScroll = wrapEl.scrollLeft;
  });
  window.addEventListener('mouseup', () => { isDown = false; wrapEl.classList.remove('dragging'); });
  window.addEventListener('mousemove', e => {
    if (!isDown) return;
    const dx = e.pageX - startX;
    if (Math.abs(dx) > 4) moved = true;
    wrapEl.scrollLeft = startScroll - dx;
  });
  // 拖曳超過閾值時，這次放開不要誤觸底下卡片的click（避免拖曳跟點擊互相干擾）
  wrapEl.addEventListener('click', e => { if (moved) { e.stopPropagation(); moved = false; } }, true);
}
document.querySelectorAll('.hand-fan-wrap').forEach(enableDragScroll);

// 棄牌堆點擊檢視
document.getElementById('my-discard-pile').addEventListener('click', () => showPeek('我的棄牌堆', state?.you?.discard));
document.getElementById('opp-discard-pile').addEventListener('click', () => showPeek('對手的棄牌堆', state?.opponent?.discard));

// 能量區拖曳到寶可夢身上＝附加能量（跟原本點擊能量區→點目標的模式並存，兩種操作都可以）
const energyChipEl = document.getElementById('energy-zone-chip');
energyChipEl.addEventListener('dragstart', e => {
  if (!state || !state.you.pendingEnergy || state.you.energyAttachedThisTurn || state.turn !== myRole) { e.preventDefault(); return; }
  e.dataTransfer.setData('text/plain', 'pocket-energy');
});
document.getElementById('board-overlay').addEventListener('dragover', e => {
  if (e.target.closest('#my-active, #my-bench')) e.preventDefault();
});
document.getElementById('board-overlay').addEventListener('drop', e => {
  const slot = e.target.closest('#my-active .board-slot[data-uid], #my-bench .board-slot[data-uid]');
  if (!slot) return;
  e.preventDefault();
  wsSend({ type: 'pocket_attach_energy', target: slot.dataset.uid });
});

// ── 攻擊事件重播：擲硬幣動畫 → 屬性特效 → 傷害飄字/受擊震動 ──
let lastSeenEventSeq = 0;
function handlePocketEvent(evt) {
  if (!evt || evt.seq <= lastSeenEventSeq) return;
  lastSeenEventSeq = evt.seq;
  (async () => {
    if (evt.coinFlips && evt.coinFlips.length) await playCoinFlipAnim(evt.coinFlips);
    if (evt.kind === 'attack') {
      if (evt.damage > 0 || evt.selfDamage > 0) playAttackVfx(evt.attackerRole, evt.atkType, evt.targetUid);
      if (evt.damage > 0) showDamageFloat(evt.targetUid, evt.damage);
      if (evt.selfDamage > 0) showDamageFloat(evt.attackerUid, evt.selfDamage);
    }
  })();
}

function playCoinFlipAnim(results) {
  return new Promise(resolve => {
    const overlay = document.getElementById('coin-flip-overlay');
    const coinsEl = document.getElementById('coin-flip-coins');
    coinsEl.innerHTML = results.map(() => `<div class="coin">?</div>`).join('');
    overlay.style.display = 'flex';
    const coinEls = [...coinsEl.children];
    setTimeout(() => { coinEls.forEach((el, i) => { el.textContent = results[i] ? '正' : '反'; el.classList.toggle('tails', !results[i]); }); }, 550);
    setTimeout(() => { overlay.style.display = 'none'; resolve(); }, 1250);
  });
}

// 上場特效——跟pokemon_battle.html的spawnSummonEffect同一套手法（擴散環+粒子），這裡只是
// 換成pocket的TYPE_COLOR/型別欄位(p.types[0]是字串如'Fire'，不是那邊的小寫type id，直接查表即可)
function spawnSummonEffect(cardEl, type) {
  if (!cardEl) return;
  const color = TYPE_COLOR[type] || '#e8eaf6';
  cardEl.style.position = 'relative';
  const ring = document.createElement('div');
  ring.className = 'summon-ring';
  ring.style.borderColor = color;
  cardEl.appendChild(ring);
  setTimeout(() => ring.remove(), 600);
  for (let i = 0; i < 10; i++) {
    const particle = document.createElement('div');
    const angle = (i / 10) * 2 * Math.PI;
    const dist = 42 + Math.random() * 24;
    particle.className = 'summon-particle';
    particle.style.background = color;
    particle.style.setProperty('--mpx', Math.cos(angle) * dist + 'px');
    particle.style.setProperty('--mpy', Math.sin(angle) * dist + 'px');
    cardEl.appendChild(particle);
    setTimeout(() => particle.remove(), 650);
  }
}

function playAttackVfx(attackerRole, atkType, targetUid) {
  const attackerEl = document.getElementById(attackerRole === myRole ? 'my-active' : 'opp-active');
  const targetSlot = document.querySelector(`.board-slot[data-uid="${targetUid}"]`);
  const targetEl = targetSlot || document.getElementById(attackerRole === myRole ? 'opp-active' : 'my-active');
  if (!attackerEl || !targetEl || typeof attackerEl.animate !== 'function') return;
  const a = attackerEl.getBoundingClientRect();
  const t = targetEl.getBoundingClientRect();
  const color = TYPE_COLOR[atkType] || '#fff';
  const layer = document.getElementById('vfx-layer');
  const bolt = document.createElement('div');
  bolt.className = 'vfx-bolt';
  bolt.style.color = color; bolt.style.background = color;
  bolt.style.left = (a.left + a.width / 2) + 'px';
  bolt.style.top = (a.top + a.height / 2) + 'px';
  layer.appendChild(bolt);
  const dx = (t.left + t.width / 2) - (a.left + a.width / 2);
  const dy = (t.top + t.height / 2) - (a.top + a.height / 2);
  bolt.animate([
    { transform: 'translate(0,0)', opacity: 0 },
    { transform: 'translate(0,0)', opacity: 1, offset: 0.1 },
    { transform: `translate(${dx}px, ${dy}px)`, opacity: 1, offset: 0.85 },
    { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 },
  ], { duration: 500, easing: 'ease-in' });
  setTimeout(() => {
    bolt.remove();
    const impact = document.createElement('div');
    impact.className = 'vfx-impact';
    impact.style.color = color;
    impact.style.left = (t.left + t.width / 2) + 'px';
    impact.style.top = (t.top + t.height / 2) + 'px';
    layer.appendChild(impact);
    impact.animate([
      { opacity: 0, transform: 'translate(-50%,-50%) scale(0.3)' },
      { opacity: 0.85, transform: 'translate(-50%,-50%) scale(1.3)', offset: 0.3 },
      { opacity: 0, transform: 'translate(-50%,-50%) scale(1.6)' },
    ], { duration: 380 });
    setTimeout(() => impact.remove(), 400);
    if (targetSlot) {
      targetSlot.classList.add('hit-shake', 'hit-flash');
      setTimeout(() => targetSlot.classList.remove('hit-shake', 'hit-flash'), 450);
    }
  }, 480);
}

function showDamageFloat(uid, dmg) {
  const slot = document.querySelector(`.board-slot[data-uid="${uid}"]`);
  if (!slot) return;
  const rect = slot.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'dmg-float';
  el.textContent = '-' + dmg;
  el.style.left = (rect.left + rect.width / 2) + 'px';
  el.style.top = rect.top + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
</script>
