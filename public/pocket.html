<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pokémon TCG Pocket 對戰 — 組牌</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #07091a;
    --surface: rgba(255,255,255,0.05);
    --border:  rgba(255,255,255,0.10);
    --text:    #e8eaf6;
    --muted:   #7986cb;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  #stars { position:fixed; inset:0; z-index:0; pointer-events:none; }

  .page { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }

  header.top { padding:1rem 1.4rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  header.top h1 { font-size:1.15rem; font-weight:800; background:linear-gradient(135deg,#f8d030 0%,#f05030 50%,#6890f0 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  header.top .sub { color:var(--muted); font-size:0.8rem; }

  .layout { flex:1; display:grid; grid-template-columns:1fr 340px; gap:0; min-height:0; }
  @media (max-width: 880px) { .layout { grid-template-columns:1fr; } }
  @media (max-width: 480px) {
    .board-top-bar { flex-wrap:wrap; gap:0.4rem; }
    .board-slot { width:62px; font-size:0.56rem; }
    .active-row .board-slot { width:78px; font-size:0.62rem; }
    .bench-row { gap:0.35rem; }
    .attack-row { width:100%; padding:0 0.6rem; }
    .setup-box, .peek-box { padding:1.1rem; }
  }

  /* ── pool ── */
  .pool { padding:1rem 1.2rem 2rem; min-width:0; }
  .filters { display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1rem; position:sticky; top:0; background:rgba(7,9,26,0.92); backdrop-filter:blur(6px); padding:0.6rem 0; z-index:5; }
  .filters input, .filters select { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:0.5rem 0.8rem; border-radius:8px; font-size:0.85rem; }
  .filters input { flex:1; min-width:140px; }
  .pool-count { color:var(--muted); font-size:0.8rem; margin-bottom:0.6rem; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:0.7rem; }
  .card-tile { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:0.5rem; cursor:pointer; transition:transform .15s, border-color .15s; position:relative; }
  .card-tile:hover:not(.maxed) { transform:translateY(-3px); border-color:rgba(255,255,255,0.28); }
  .card-tile.maxed { opacity:0.35; cursor:not-allowed; }
  .card-tile img { width:100%; border-radius:6px; display:block; background:#111; aspect-ratio:5/7; object-fit:cover; }
  .card-tile .name { font-size:0.72rem; font-weight:700; margin-top:0.4rem; line-height:1.2; }
  .card-tile .meta { font-size:0.65rem; color:var(--muted); margin-top:0.15rem; }
  .card-tile .type-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:3px; }
  .card-tile .count-badge { position:absolute; top:4px; right:4px; background:#f05030; color:#fff; font-size:0.65rem; font-weight:800; border-radius:999px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

  /* ── deck panel ── */
  .deck-panel { border-left:1px solid var(--border); background:rgba(255,255,255,0.02); padding:1rem 1.1rem 1.5rem; display:flex; flex-direction:column; gap:0.8rem; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto; }
  .deck-count { font-size:1.4rem; font-weight:800; }
  .deck-count .ok { color:#69f0ae; }
  .deck-count .bad { color:#ff8a80; }
  .deck-warn { font-size:0.78rem; color:#ffab91; background:rgba(255,138,101,0.08); border:1px solid rgba(255,138,101,0.25); border-radius:8px; padding:0.5rem 0.7rem; display:none; }
  .deck-warn.show { display:block; }
  .deck-list { display:flex; flex-direction:column; gap:0.35rem; flex:1; overflow-y:auto; }
  .deck-row { display:flex; align-items:center; gap:0.5rem; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:0.4rem 0.5rem; font-size:0.78rem; }
  .deck-row img { width:28px; height:39px; border-radius:4px; object-fit:cover; background:#111; }
  .deck-row .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deck-row .x { color:var(--muted); font-weight:700; }
  .deck-row button { background:rgba(255,255,255,0.08); border:1px solid var(--border); color:var(--text); border-radius:6px; width:22px; height:22px; cursor:pointer; font-size:0.8rem; line-height:1; }
  .deck-row button:hover { background:rgba(255,255,255,0.16); }
  .deck-empty { color:var(--muted); font-size:0.8rem; text-align:center; padding:2rem 0; }

  .btn { padding:0.6rem 1rem; border:none; border-radius:999px; font-size:0.85rem; font-weight:700; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:linear-gradient(135deg,#f8d030,#f05030); color:#fff; }
  .btn-primary:disabled { opacity:0.35; cursor:not-allowed; }
  .btn-secondary { background:rgba(255,255,255,0.07); color:var(--text); border:1px solid var(--border); }
  .btn-secondary:hover { background:rgba(255,255,255,0.13); }
  .btn-row { display:flex; gap:0.5rem; }
  .btn-row .btn { flex:1; }

  .save-toast { position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%) translateY(20px); background:#1b2040; border:1px solid var(--border); color:var(--text); padding:0.6rem 1.2rem; border-radius:999px; font-size:0.85rem; opacity:0; transition:all .25s; z-index:50; pointer-events:none; }
  .save-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ── lobby modal ── */
  .lobby-overlay { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.55); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; }
  .lobby-overlay.open { display:flex; }
  .lobby-box { position:relative; background:#10132b; border:1px solid var(--border); border-radius:16px; padding:2rem 2.2rem; width:min(90vw,380px); text-align:center; }
  .lobby-box h2 { font-size:1.2rem; margin-bottom:0.6rem; }
  .lobby-sub { color:var(--muted); font-size:0.85rem; margin-bottom:1rem; }
  .lobby-close { position:absolute; top:0.7rem; right:0.9rem; background:none; border:none; color:var(--muted); font-size:1rem; cursor:pointer; }
  .lobby-close:hover { color:var(--text); }
  .join-row { display:flex; gap:0.5rem; margin-top:0.8rem; }
  .join-row input { flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:0.6rem 0.8rem; border-radius:8px; text-align:center; letter-spacing:0.1em; text-transform:uppercase; font-size:0.9rem; }
  .lobby-error { color:#ff8a80; font-size:0.8rem; margin-top:0.7rem; min-height:1em; }
  .room-code { font-size:2.2rem; font-weight:800; letter-spacing:0.15em; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:0.8rem; margin-bottom:0.8rem; }

  /* ── board ── */
  .board-overlay { position:fixed; inset:0; z-index:60; background:var(--bg); display:none; flex-direction:column; overflow-y:auto; }
  .board-overlay.open { display:flex; }
  .board-top-bar { display:flex; justify-content:space-between; align-items:center; padding:0.6rem 1rem; border-bottom:1px solid var(--border); font-size:0.85rem; }
  .points-row { display:flex; gap:1rem; color:var(--muted); }
  .points-row b { color:var(--text); font-size:1.1rem; }
  .side-info { text-align:center; font-size:0.75rem; color:var(--muted); padding:0.3rem; }
  .opp-area, .my-area { padding:0.5rem 1rem; }
  .bench-row { display:flex; gap:0.5rem; justify-content:center; min-height:70px; }
  .active-row { display:flex; justify-content:center; padding:0.4rem 0; }
  .mid-area { display:flex; align-items:center; justify-content:center; gap:1rem; padding:0.5rem; min-height:44px; }
  .energy-zone { width:34px; height:34px; border-radius:50%; border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:0.7rem; cursor:pointer; }
  .energy-zone.has-energy { border-style:solid; cursor:pointer; }
  .energy-zone.picking { box-shadow:0 0 0 3px rgba(248,208,48,0.5); }
  .action-hint { color:#ffd54f; font-size:0.8rem; min-height:1.2em; }

  .board-slot { width:76px; text-align:center; font-size:0.62rem; cursor:default; }
  .board-slot.empty { border:1px dashed var(--border); border-radius:8px; height:100%; min-height:60px; }
  .board-slot img { width:100%; border-radius:6px; background:#111; aspect-ratio:5/7; object-fit:cover; }
  .board-slot.pickable img { outline:2px solid #ffd54f; cursor:pointer; }
  .board-slot .board-name { font-weight:700; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .active-row .board-slot { width:96px; font-size:0.7rem; }
  .hp-bar { height:5px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; margin-top:2px; }
  .hp-fill { height:100%; background:#69f0ae; transition:width 0.35s ease, background 0.35s ease; }
  .hp-fill.low { background:#ff8a80; }
  .energy-row { display:flex; gap:2px; justify-content:center; margin-top:2px; flex-wrap:wrap; }
  .energy-icon { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .mini-btn { font-size:0.58rem; background:rgba(255,255,255,0.1); border:1px solid var(--border); color:var(--text); border-radius:5px; padding:1px 4px; margin-top:2px; cursor:pointer; }
  .mini-btn:hover { background:rgba(255,255,255,0.2); }
  .peek-overlay { position:fixed; inset:0; z-index:90; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; }
  .peek-box { background:#10132b; border:1px solid var(--border); border-radius:16px; padding:1.4rem; width:min(90vw,420px); text-align:center; }
  .peek-list { display:flex; gap:0.4rem; justify-content:center; flex-wrap:wrap; margin:1rem 0; }
  .peek-list img { width:70px; border-radius:6px; }

  .attack-row { display:flex; flex-direction:column; gap:0.4rem; max-width:420px; margin:0.5rem auto; }
  .attack-btn { display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:0.5rem 0.8rem; cursor:pointer; font-size:0.82rem; }
  .attack-btn:hover:not(:disabled) { background:rgba(255,255,255,0.1); }
  .attack-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .attack-cost { display:flex; gap:2px; }

  .turn-controls { display:flex; gap:0.6rem; justify-content:center; margin:0.5rem 0; }
  .hand-row { display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap; padding:0.6rem 0 1.2rem; }
  .hand-row .board-slot img { cursor:pointer; }
  .hand-row .board-slot img:hover { outline:2px solid #ffd54f; }

  .setup-overlay { position:absolute; inset:0; z-index:70; background:rgba(0,0,0,0.75); display:flex; align-items:center; justify-content:center; }
  .setup-box { background:#10132b; border:1px solid var(--border); border-radius:16px; padding:1.6rem; width:min(92vw,560px); text-align:center; max-height:85vh; overflow-y:auto; }
  .setup-hand { display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap; margin:1rem 0; }
  .setup-hand .board-slot img { cursor:pointer; }
  .setup-hand .board-slot.chosen-active img { outline:3px solid #f8d030; }
  .setup-hand .board-slot.chosen-bench img { outline:3px solid #6890f0; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="page">
  <header class="top">
    <div>
      <h1>Pokémon TCG Pocket 對戰</h1>
      <div class="sub">組牌 — 精選 A1 創世紀卡池</div>
    </div>
    <div class="sub" id="pack-info">載入卡池中...</div>
  </header>

  <div class="layout">
    <div class="pool">
      <div class="filters">
        <input id="q" placeholder="搜尋卡名..." />
        <select id="cat">
          <option value="">全部類別</option>
          <option value="Pokemon">寶可夢</option>
          <option value="Trainer">訓練師</option>
        </select>
        <select id="type">
          <option value="">全部屬性</option>
        </select>
      </div>
      <div class="pool-count" id="pool-count"></div>
      <div class="grid" id="grid"></div>
    </div>

    <aside class="deck-panel">
      <div class="deck-count">牌組 <span id="deck-total">0</span> / 20</div>
      <div class="deck-warn" id="deck-warn"></div>
      <div class="deck-list" id="deck-list"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="clearDeck()">清空</button>
        <button class="btn btn-primary" id="save-btn" onclick="saveDeck()">儲存牌組</button>
      </div>
      <button class="btn btn-secondary" id="goto-lobby-btn" onclick="openLobby()" disabled style="width:100%">🔗 前往連線對戰</button>
    </aside>
  </div>
</div>

<div class="save-toast" id="save-toast">牌組已儲存</div>

<div class="lobby-overlay" id="lobby-overlay">
  <div class="lobby-box">
    <button class="lobby-close" onclick="closeLobby()">✕</button>

    <div id="lobby-step-choose">
      <h2>連線對戰</h2>
      <p class="lobby-sub">牌組已儲存（20張），可以建立房間或輸入房號加入</p>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="createRoom()">建立房間</button>
      </div>
      <div class="join-row">
        <input id="join-code-input" maxlength="4" placeholder="輸入4碼房號">
        <button class="btn btn-secondary" onclick="joinRoom()">加入</button>
      </div>
      <div class="lobby-error" id="lobby-error"></div>
    </div>

    <div id="lobby-step-waiting" style="display:none">
      <h2>房間代碼</h2>
      <div class="room-code" id="room-code-display"></div>
      <p class="lobby-sub">請把房號給對方，等待加入中...</p>
    </div>

    <div id="lobby-step-ready" style="display:none">
      <h2>雙方已連線</h2>
      <p class="lobby-sub" id="ready-status">已送出牌組，等待對手...</p>
    </div>

    <div id="lobby-step-started" style="display:none">
      <h2>對戰開始！</h2>
      <p class="lobby-sub" id="started-status"></p>
    </div>
  </div>
</div>

<div class="board-overlay" id="board-overlay">
  <div class="board-top-bar">
    <div class="turn-indicator" id="turn-indicator"></div>
    <div class="points-row"><span>你 <b id="my-points">0</b></span><span>對手 <b id="opp-points">0</b></span></div>
  </div>

  <div class="opp-area">
    <div class="side-info">牌庫 <span id="opp-deck-count"></span>張 · 手牌 <span id="opp-hand-count"></span>張</div>
    <div class="bench-row" id="opp-bench"></div>
    <div class="active-row" id="opp-active"></div>
  </div>

  <div class="mid-area">
    <div class="energy-zone" id="energy-zone-chip"></div>
    <div class="action-hint" id="action-hint"></div>
  </div>

  <div class="my-area">
    <div class="active-row" id="my-active"></div>
    <div class="attack-row" id="attack-row"></div>
    <div class="turn-controls">
      <button class="btn btn-secondary" id="cancel-action-btn" onclick="cancelAction()" style="display:none">取消</button>
      <button class="btn btn-primary" id="end-turn-btn" onclick="endTurn()">結束回合</button>
    </div>
    <div class="bench-row" id="my-bench"></div>
    <div class="hand-row" id="hand-row"></div>
  </div>

  <div class="setup-overlay" id="setup-overlay">
    <div class="setup-box">
      <h2>選擇出戰寶可夢</h2>
      <p class="lobby-sub">先點1隻<b>基礎寶可夢</b>當主戰，可以再點最多3隻放板凳</p>
      <div class="setup-hand" id="setup-hand"></div>
      <p class="lobby-sub" id="setup-picks-label"></p>
      <button class="btn btn-primary" id="setup-confirm-btn" onclick="confirmSetup()" disabled>確認出戰</button>
    </div>
  </div>

  <div class="setup-overlay" id="setup-wait-overlay" style="display:none">
    <div class="setup-box"><h2>已送出出戰名單</h2><p class="lobby-sub">等待對手選擇中...</p></div>
  </div>

  <div class="setup-overlay" id="switch-overlay" style="display:none">
    <div class="setup-box">
      <h2 id="switch-title">選擇新的主戰寶可夢</h2>
      <div class="setup-hand" id="switch-choices"></div>
    </div>
  </div>

  <div class="setup-overlay" id="gameover-overlay" style="display:none">
    <div class="setup-box">
      <h2 id="gameover-title"></h2>
      <button class="btn btn-secondary" onclick="location.reload()">回到組牌</button>
    </div>
  </div>

  <div class="peek-overlay" id="peek-overlay" style="display:none">
    <div class="peek-box">
      <h2 id="peek-title"></h2>
      <div class="peek-list" id="peek-list"></div>
      <button class="btn btn-secondary" onclick="closePeek()">關閉</button>
    </div>
  </div>
</div>

<script>
/* ─────────────────────────────────────────
   STAR CANVAS
───────────────────────────────────────── */
(function(){
  const cvs = document.getElementById('stars');
  const ctx = cvs.getContext('2d');
  let stars = [];
  function resize(){
    cvs.width=innerWidth; cvs.height=innerHeight;
    stars=Array.from({length:130},()=>({x:Math.random()*cvs.width,y:Math.random()*cvs.height,r:Math.random()*1.3+0.2,a:Math.random(),da:(Math.random()-0.5)*0.007}));
  }
  function draw(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    for(const s of stars){s.a+=s.da;if(s.a<=0.05||s.a>=1)s.da=-s.da;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.a.toFixed(2)})`;ctx.fill();}
    requestAnimationFrame(draw);
  }
  resize(); draw(); addEventListener('resize',resize);
})();

/* ─────────────────────────────────────────
   Deck builder
───────────────────────────────────────── */
const TYPE_COLOR = {
  Fire:'#f08030', Water:'#6890f0', Lightning:'#f8d030', Psychic:'#f85888',
  Fighting:'#c03028', Darkness:'#705848', Dragon:'#7038f8', Colorless:'#a8a878', Grass:'#78c850'
};
const TYPE_ZH = {
  Fire:'火', Water:'水', Lightning:'電', Psychic:'超能力',
  Fighting:'格鬥', Darkness:'惡', Dragon:'龍', Colorless:'無色', Grass:'草'
};
const DECK_KEY = 'pocketDeck';
const DECK_SIZE = 20;
const MAX_COPIES = 2;

let ALL_CARDS = [];
let cardById = {};
/** deck: array of card ids (each entry = 1 copy) */
let deck = [];

async function loadCards() {
  const res = await fetch('pocket-cards.json');
  const data = await res.json();
  ALL_CARDS = data.cards;
  ALL_CARDS.forEach(c => cardById[c.id] = c);
  document.getElementById('pack-info').textContent = `卡池 ${ALL_CARDS.length} 張`;

  const typeSet = new Set();
  ALL_CARDS.forEach(c => (c.types || []).forEach(t => typeSet.add(t)));
  const typeSel = document.getElementById('type');
  [...typeSet].sort().forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = TYPE_ZH[t] || t;
    typeSel.appendChild(o);
  });

  const saved = JSON.parse(localStorage.getItem(DECK_KEY) || '[]');
  deck = saved.filter(id => cardById[id]);

  renderPool();
  renderDeck();
}

function countInDeck(id) {
  return deck.filter(x => x === id).length;
}

function addCard(id) {
  const card = cardById[id];
  if (!card) return;
  if (deck.length >= DECK_SIZE) return;
  if (countInDeck(id) >= MAX_COPIES) return;
  deck.push(id);
  renderPool();
  renderDeck();
}

function removeCard(id) {
  const idx = deck.lastIndexOf(id);
  if (idx >= 0) deck.splice(idx, 1);
  renderPool();
  renderDeck();
}

function clearDeck() {
  deck = [];
  renderPool();
  renderDeck();
}

function saveDeck() {
  localStorage.setItem(DECK_KEY, JSON.stringify(deck));
  const toast = document.getElementById('save-toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1400);
}

function deckValidation() {
  const total = deck.length;
  const hasBasic = deck.some(id => {
    const c = cardById[id];
    return c && c.category === 'Pokemon' && c.stage === 'Basic';
  });
  const problems = [];
  if (total !== DECK_SIZE) problems.push(`需要剛好 ${DECK_SIZE} 張（目前 ${total} 張）`);
  if (!hasBasic) problems.push('至少需要 1 張基礎寶可夢');
  return { total, hasBasic, valid: problems.length === 0, problems };
}

function renderPool() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const cat = document.getElementById('cat').value;
  const type = document.getElementById('type').value;
  const filtered = ALL_CARDS.filter(c => {
    if (q && !c.name.toLowerCase().includes(q)) return false;
    if (cat && c.category !== cat) return false;
    if (type && !(c.types || []).includes(type)) return false;
    return true;
  });
  document.getElementById('pool-count').textContent = `顯示 ${filtered.length} / ${ALL_CARDS.length} 張`;

  const grid = document.getElementById('grid');
  grid.innerHTML = filtered.map(c => {
    const n = countInDeck(c.id);
    const maxed = n >= MAX_COPIES || deck.length >= DECK_SIZE;
    const typeDots = (c.types || []).map(t => `<span class="type-dot" style="background:${TYPE_COLOR[t] || '#888'}"></span>`).join('');
    const metaLine = c.category === 'Pokemon'
      ? `${typeDots}${TYPE_ZH[c.types?.[0]] || ''} · ${c.stage === 'Basic' ? '基礎' : c.stage === 'Stage1' ? '第1階' : '第2階'}${c.ex ? ' · EX' : ''} · HP${c.hp}`
      : c.trainerType === 'Supporter' ? '支援者卡' : '道具卡';
    return `
      <div class="card-tile ${maxed && n < MAX_COPIES ? 'maxed' : ''}" onclick="addCard('${c.id}')" title="${maxed ? '已達上限或牌組已滿' : '點擊加入牌組'}">
        ${n > 0 ? `<div class="count-badge">${n}</div>` : ''}
        <img src="${c.image}" loading="lazy" alt="${c.name}">
        <div class="name">${c.name}</div>
        <div class="meta">${metaLine}</div>
      </div>`;
  }).join('');
}

function renderDeck() {
  const v = deckValidation();
  document.getElementById('deck-total').innerHTML = `<span class="${v.total === DECK_SIZE ? 'ok' : 'bad'}">${v.total}</span>`;
  const warn = document.getElementById('deck-warn');
  if (v.problems.length) {
    warn.textContent = v.problems.join('　·　');
    warn.classList.add('show');
  } else {
    warn.classList.remove('show');
  }
  document.getElementById('save-btn').disabled = !v.valid;
  document.getElementById('goto-lobby-btn').disabled = !v.valid;

  // group by id, preserve first-seen order
  const groups = [];
  const seen = {};
  deck.forEach(id => {
    if (!(id in seen)) { seen[id] = groups.length; groups.push({ id, count: 0 }); }
    groups[seen[id]].count++;
  });

  const list = document.getElementById('deck-list');
  if (!groups.length) {
    list.innerHTML = '<div class="deck-empty">從左邊卡池點擊卡片加入牌組</div>';
    return;
  }
  list.innerHTML = groups.map(g => {
    const c = cardById[g.id];
    return `
      <div class="deck-row">
        <img src="${c.image}" alt="${c.name}">
        <div class="n">${c.name}</div>
        <div class="x">×${g.count}</div>
        <button onclick="removeCard('${g.id}')">−</button>
      </div>`;
  }).join('');
}

['q', 'cat', 'type'].forEach(id => document.getElementById(id).addEventListener('input', renderPool));

loadCards();

/* ─────────────────────────────────────────
   Lobby / WS connection（Phase 3：房間骨架，核心回合引擎還沒做）
───────────────────────────────────────── */
let ws = null;
let myRole = null; // 'p1' | 'p2'

function lobbyShowStep(step) {
  ['choose', 'waiting', 'ready', 'started'].forEach(s => {
    document.getElementById(`lobby-step-${s}`).style.display = s === step ? '' : 'none';
  });
}

function openLobby() {
  if (deckValidation().valid !== true) return;
  document.getElementById('lobby-overlay').classList.add('open');
  lobbyShowStep('choose');
  document.getElementById('lobby-error').textContent = '';
  connectWs();
}

function closeLobby() {
  document.getElementById('lobby-overlay').classList.remove('open');
  if (ws) { ws.close(); ws = null; }
}

function connectWs() {
  if (ws) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onmessage = e => handleWsMsg(JSON.parse(e.data));
  ws.onclose = () => { ws = null; };
}

function wsSend(msg) {
  if (ws?.readyState === 1) ws.send(JSON.stringify(msg));
  else if (ws) ws.addEventListener('open', () => ws.send(JSON.stringify(msg)), { once: true });
}

function createRoom() {
  wsSend({ type: 'pocket_create_room' });
}

function joinRoom() {
  const code = document.getElementById('join-code-input').value.trim();
  if (!code) return;
  wsSend({ type: 'pocket_join_room', code });
}

function handleWsMsg(msg) {
  switch (msg.type) {
    case 'pocket_room_created':
      myRole = msg.role;
      document.getElementById('room-code-display').textContent = msg.code;
      lobbyShowStep('waiting');
      break;
    case 'pocket_joined':
      myRole = msg.role;
      wsSend({ type: 'pocket_submit_deck', deck });
      lobbyShowStep('ready');
      document.getElementById('ready-status').textContent = '已送出牌組，等待對手...';
      break;
    case 'pocket_opponent_joined':
      wsSend({ type: 'pocket_submit_deck', deck });
      lobbyShowStep('ready');
      document.getElementById('ready-status').textContent = '對手已加入，已送出牌組，等待對手送出...';
      break;
    case 'pocket_opponent_ready':
      document.getElementById('ready-status').textContent = '對手已送出牌組，等待對戰開始...';
      break;
    case 'pocket_match_start': {
      const iAmFirst = msg.firstPlayer === myRole;
      lobbyShowStep('started');
      document.getElementById('started-status').textContent = `先攻：${iAmFirst ? '你' : '對手'}`;
      setTimeout(() => {
        document.getElementById('lobby-overlay').classList.remove('open');
        document.getElementById('board-overlay').classList.add('open');
        applyState(msg);
      }, 900);
      break;
    }
    case 'pocket_turn_state':
      applyState(msg);
      break;
    case 'pocket_peek':
      showPeek(msg.title, msg.cards);
      break;
    case 'pocket_opponent_disconnected':
      document.getElementById('lobby-error').textContent = '對手已離線';
      document.getElementById('action-hint').textContent = '對手已離線';
      break;
    case 'error':
      document.getElementById('lobby-error').textContent = msg.message || '發生錯誤';
      document.getElementById('action-hint').textContent = msg.message || '';
      break;
  }
}

/* ─────────────────────────────────────────
   對戰畫面（Phase 4：核心回合引擎——招式只算固定傷害+弱點，
   訓練師卡/招式的文字效果尚未實作）
───────────────────────────────────────── */
let state = null; // 最新一份 pocket_turn_state / pocket_match_start
let selectedAction = null; // null | {mode:'attach'} | {mode:'evolve', handUid, from} | {mode:'retreat'}

function applyState(msg) {
  state = msg;
  selectedAction = null;
  renderBoard();
}

function typeDots(types) {
  return (types || []).map(t => `<span class="type-dot" style="background:${TYPE_COLOR[t] || '#888'}"></span>`).join('');
}

const STATUS_LABEL = { asleep: '😴 睡眠', poisoned: '☠️ 中毒', paralyzed: '⚡ 麻痺' };
function renderPokeSlot(p, { pickable = false, dataset = {}, own = false } = {}) {
  if (!p) return '<div class="board-slot empty"></div>';
  const hpPct = p.hp ? Math.max(0, Math.round(((p.curHp ?? p.hp) / p.hp) * 100)) : 100;
  const energyIcons = (p.energy || []).map(e => `<span class="energy-icon" style="background:${TYPE_COLOR[e] || '#888'}"></span>`).join('');
  const attrs = Object.entries(dataset).map(([k, v]) => `data-${k}="${v}"`).join(' ');
  const statusHtml = p.status ? `<div style="color:#ffd54f">${STATUS_LABEL[p.status] || p.status}</div>` : '';
  let extraBtns = '';
  if (own && state?.turn === myRole && state.phase === 'active') {
    const ability = p.abilities?.[0];
    if (ability && ABILITY_NAMES_SUPPORTED.has(ability.name) && !state.you.abilitiesUsedThisTurn.includes(p.uid)) {
      extraBtns += `<button class="mini-btn" data-ability-uid="${p.uid}" title="${ability.name}">特性</button>`;
    }
    if (p.isFossil) extraBtns += `<button class="mini-btn" data-fossil-uid="${p.uid}">棄置</button>`;
  }
  return `
    <div class="board-slot ${pickable ? 'pickable' : ''}" data-uid="${p.uid}" ${attrs}>
      <img src="${p.image}" alt="${p.name}">
      <div class="board-name">${p.name}${p.ex ? ' EX' : ''}</div>
      <div class="hp-bar"><div class="hp-fill ${hpPct <= 30 ? 'low' : ''}" style="width:${hpPct}%"></div></div>
      <div>${p.curHp ?? p.hp}/${p.hp}</div>
      <div class="energy-row">${energyIcons}</div>
      ${statusHtml}
      ${extraBtns}
    </div>`;
}
const ABILITY_NAMES_SUPPORTED = new Set(['Volt Charge', 'Sleep Pendulum', 'Psy Shadow', 'Gas Leak']);

function renderBoard() {
  if (!state) return;
  const { you, opponent, turn, turnNumber, phase, pendingSwitchRole } = state;
  const myTurn = turn === myRole;

  document.getElementById('turn-indicator').textContent = phase === 'done' ? '對戰結束' : `第 ${turnNumber} 回合 · ${myTurn ? '輪到你' : '對手回合'}`;
  document.getElementById('my-points').textContent = you.points;
  document.getElementById('opp-points').textContent = opponent.points;
  document.getElementById('opp-deck-count').textContent = opponent.deckCount;
  document.getElementById('opp-hand-count').textContent = opponent.handCount;

  document.getElementById('opp-active').innerHTML = renderPokeSlot(opponent.active);
  document.getElementById('opp-bench').innerHTML = (opponent.bench || []).map(p => renderPokeSlot(p)).join('') || '<div class="board-slot empty"></div>'.repeat(3);
  document.getElementById('my-active').innerHTML = renderPokeSlot(you.active, {
    pickable: !!selectedAction && selectedAction.mode !== 'retreat',
    dataset: { zone: 'active' },
    own: true,
  });
  document.getElementById('my-bench').innerHTML = (you.bench || []).map(p => renderPokeSlot(p, {
    pickable: !!selectedAction,
    dataset: { zone: 'bench' },
    own: true,
  })).join('');

  // energy zone chip
  const chip = document.getElementById('energy-zone-chip');
  if (you.pendingEnergy && !you.energyAttachedThisTurn && myTurn) {
    chip.className = `energy-zone has-energy ${selectedAction?.mode === 'attach' ? 'picking' : ''}`;
    chip.style.background = TYPE_COLOR[you.pendingEnergy] || '#888';
    chip.textContent = '';
    chip.title = `點擊附加 ${TYPE_ZH[you.pendingEnergy] || you.pendingEnergy} 能量`;
    chip.onclick = () => {
      if (!myTurn) return;
      selectedAction = selectedAction?.mode === 'attach' ? null : { mode: 'attach' };
      updateActionHint();
      renderBoard();
    };
  } else {
    chip.className = 'energy-zone';
    chip.textContent = you.energyAttachedThisTurn ? '✓' : '—';
    chip.onclick = null;
    chip.style.background = 'transparent';
  }

  // attack buttons
  const atkRow = document.getElementById('attack-row');
  if (you.active && myTurn && phase === 'active') {
    atkRow.innerHTML = (you.active.attacks || []).map((a, i) => {
      const affordable = pocketCanPayCostClient(you.active, a.cost);
      const costHtml = (a.cost || []).map(t => `<span class="energy-icon" style="background:${TYPE_COLOR[t] || '#888'}"></span>`).join('');
      return `<button class="attack-btn" ${affordable ? '' : 'disabled'} onclick="doAttack(${i})">
        <span>${a.name}</span>
        <span class="attack-cost">${costHtml}</span>
        <span>${a.damage || '-'}</span>
      </button>`;
    }).join('') || '<div class="lobby-sub">這隻寶可夢沒有招式</div>';
  } else {
    atkRow.innerHTML = '';
  }

  document.getElementById('end-turn-btn').style.display = myTurn && phase === 'active' ? '' : 'none';
  document.getElementById('cancel-action-btn').style.display = selectedAction ? '' : 'none';

  // hand row
  const handRow = document.getElementById('hand-row');
  handRow.innerHTML = (you.hand || []).map(c => {
    const label = c.category === 'Pokemon' ? `${c.stage === 'Basic' ? '基礎' : c.stage === 'Stage1' ? '第1階' : '第2階'}` : (c.trainerType === 'Supporter' ? '支援者' : '道具');
    const locked = c.trainerType === 'Supporter' && you.supporterUsedThisTurn;
    return `<div class="board-slot ${locked ? 'maxed' : ''}" data-hand-uid="${c.uid}" data-hand-kind="${c.category}">
      <img src="${c.image}" alt="${c.name}">
      <div class="board-name">${c.name}</div>
      <div>${label}</div>
    </div>`;
  }).join('');

  updateActionHint();

  // setup overlay
  document.getElementById('setup-overlay').style.display = phase === 'setup' && !you.boardSubmitted ? 'flex' : 'none';
  document.getElementById('setup-wait-overlay').style.display = phase === 'setup' && you.boardSubmitted ? 'flex' : 'none';
  if (phase === 'setup' && !you.boardSubmitted) renderSetupHand();

  // forced switch overlay
  const needMySwitch = phase === 'forced_switch' && pendingSwitchRole === myRole;
  document.getElementById('switch-overlay').style.display = needMySwitch ? 'flex' : 'none';
  if (needMySwitch) {
    document.getElementById('switch-choices').innerHTML = (you.bench || []).map(p =>
      renderPokeSlot(p, { pickable: true, dataset: { switchPick: '1' } })
    ).join('');
  }

  if (phase === 'done') showGameOver(state.winner);
  else document.getElementById('gameover-overlay').style.display = 'none';
}

function updateActionHint() {
  const hint = document.getElementById('action-hint');
  if (!selectedAction) { hint.textContent = ''; return; }
  if (selectedAction.mode === 'attach') hint.textContent = '點擊己方的寶可夢來附加能量';
  else if (selectedAction.mode === 'evolve') hint.textContent = `點擊要進化成 ${selectedAction.name} 的寶可夢`;
  else if (selectedAction.mode === 'retreat') hint.textContent = '點擊板凳寶可夢來撤退交換';
}

function cancelAction() { selectedAction = null; renderBoard(); }

function pocketCanPayCostClient(pokemon, cost) {
  const need = {}; let colorlessNeed = 0;
  for (const t of (cost || [])) { if (t === 'Colorless') colorlessNeed++; else need[t] = (need[t] || 0) + 1; }
  const have = {};
  for (const e of (pokemon.energy || [])) have[e] = (have[e] || 0) + 1;
  for (const t in need) { if ((have[t] || 0) < need[t]) return false; have[t] -= need[t]; }
  const leftover = Object.values(have).reduce((a, b) => a + b, 0);
  return leftover >= colorlessNeed;
}

function doAttack(i) { wsSend({ type: 'pocket_attack', attackIndex: i }); }
function endTurn() { wsSend({ type: 'pocket_end_turn' }); }

const POCKET_FOSSIL_IDS = new Set(['A1-216', 'A1-217', 'A1-218']);
const TRAINER_NEEDS_TARGET = new Set(['P-A-001', 'A1-219', 'A1-220']); // Potion / Erika / Misty

// event delegation：own board (active/bench) 點擊
document.getElementById('board-overlay').addEventListener('click', e => {
  const abilityBtn = e.target.closest('[data-ability-uid]');
  if (abilityBtn) { wsSend({ type: 'pocket_use_ability', pokemonUid: abilityBtn.dataset.abilityUid }); return; }
  const fossilBtn = e.target.closest('[data-fossil-uid]');
  if (fossilBtn) { wsSend({ type: 'pocket_discard_fossil', target: fossilBtn.dataset.fossilUid }); return; }

  const slot = e.target.closest('.board-slot[data-uid]');
  if (slot && slot.closest('#my-active, #my-bench') && selectedAction) {
    const uid = slot.dataset.uid;
    if (selectedAction.mode === 'attach') wsSend({ type: 'pocket_attach_energy', target: uid });
    else if (selectedAction.mode === 'evolve') wsSend({ type: 'pocket_evolve', handUid: selectedAction.handUid, target: uid });
    else if (selectedAction.mode === 'retreat' && slot.closest('#my-bench')) wsSend({ type: 'pocket_retreat', target: uid });
    else if (selectedAction.mode === 'item-target') {
      wsSend({ type: selectedAction.isSupporter ? 'pocket_play_supporter' : 'pocket_play_item', handUid: selectedAction.handUid, target: uid });
    }
    selectedAction = null;
    return;
  }
  const switchSlot = e.target.closest('.board-slot[data-switch-pick]');
  if (switchSlot) { wsSend({ type: 'pocket_choose_active', target: switchSlot.dataset.uid }); return; }

  const handSlot = e.target.closest('.hand-row .board-slot[data-hand-uid]');
  if (handSlot && state && state.turn === myRole && state.phase === 'active') {
    const uid = handSlot.dataset.handUid;
    const card = state.you.hand.find(c => c.uid === uid);
    if (!card) return;
    if (card.category === 'Pokemon' && card.stage === 'Basic') {
      wsSend({ type: 'pocket_bench_play', handUid: uid });
    } else if (card.category === 'Pokemon') {
      selectedAction = { mode: 'evolve', handUid: uid, name: card.name };
      updateActionHint();
      renderBoard();
    } else if (card.category === 'Trainer' && POCKET_FOSSIL_IDS.has(card.id)) {
      wsSend({ type: 'pocket_bench_play', handUid: uid }); // 化石卡當基礎寶可夢上場
    } else if (card.category === 'Trainer') {
      const isSupporter = card.trainerType === 'Supporter';
      if (isSupporter && state.you.supporterUsedThisTurn) { document.getElementById('action-hint').textContent = '這回合已經用過支援者卡了'; return; }
      if (TRAINER_NEEDS_TARGET.has(card.id)) {
        selectedAction = { mode: 'item-target', handUid: uid, isSupporter };
        document.getElementById('action-hint').textContent = '點擊己方場上的寶可夢作為目標';
        renderBoard();
      } else {
        wsSend({ type: isSupporter ? 'pocket_play_supporter' : 'pocket_play_item', handUid: uid });
      }
    }
    return;
  }

  // 撤退：點自己板凳寶可夢直接進入撤退模式的捷徑（沒有先選能量/進化時）
  const benchSlot = e.target.closest('#my-bench .board-slot[data-uid]');
  if (benchSlot && !selectedAction && state && state.turn === myRole && state.phase === 'active' && !state.you.retreatedThisTurn) {
    wsSend({ type: 'pocket_retreat', target: benchSlot.dataset.uid });
  }
});

/* ── setup（開局選主戰/板凳） ── */
let setupActive = null;
let setupBench = [];
function renderSetupHand() {
  const hand = state.you.hand;
  document.getElementById('setup-hand').innerHTML = hand.map(c => {
    const isBasic = c.category === 'Pokemon' && c.stage === 'Basic';
    const cls = c.uid === setupActive ? 'chosen-active' : setupBench.includes(c.uid) ? 'chosen-bench' : '';
    return `<div class="board-slot ${cls}" data-setup-uid="${c.uid}" data-basic="${isBasic}">
      <img src="${c.image}" alt="${c.name}">
      <div class="board-name">${c.name}</div>
      <div>${isBasic ? '基礎' : (c.category === 'Pokemon' ? c.stage : c.trainerType)}</div>
    </div>`;
  }).join('');
  document.getElementById('setup-picks-label').textContent = `主戰：${setupActive ? '已選' : '未選'} · 板凳：${setupBench.length}/3`;
  document.getElementById('setup-confirm-btn').disabled = !setupActive;
}
document.getElementById('setup-hand').addEventListener('click', e => {
  const slot = e.target.closest('.board-slot[data-setup-uid]');
  if (!slot || slot.dataset.basic !== 'true') return;
  const uid = slot.dataset.setupUid;
  if (setupActive === uid) { setupActive = null; }
  else if (setupBench.includes(uid)) { setupBench = setupBench.filter(u => u !== uid); }
  else if (!setupActive) { setupActive = uid; }
  else if (setupBench.length < 3) { setupBench.push(uid); }
  renderSetupHand();
});
function confirmSetup() {
  if (!setupActive) return;
  wsSend({ type: 'pocket_setup_board', active: setupActive, bench: setupBench });
  state.you.boardSubmitted = true;
  renderBoard();
}

function showPeek(title, cards) {
  document.getElementById('peek-title').textContent = title;
  document.getElementById('peek-list').innerHTML = (cards || []).map(c => `
    <div style="text-align:center;font-size:0.65rem">
      <img src="${c.image}" alt="${c.name}"><div>${c.name}</div>
    </div>`).join('') || '<div class="lobby-sub">（沒有卡片）</div>';
  document.getElementById('peek-overlay').style.display = 'flex';
}
function closePeek() { document.getElementById('peek-overlay').style.display = 'none'; }

function showGameOver(winner) {
  const title = document.getElementById('gameover-title');
  title.textContent = winner === myRole ? '你獲勝了！' : winner ? '對手獲勝' : '對戰結束';
  document.getElementById('gameover-overlay').style.display = 'flex';
}
</script>
