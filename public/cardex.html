<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡牌圖鑑・特效館</title>
<style>
  :root {
    --bg:#07091a;
    --surface:rgba(255,255,255,0.045);
    --surface-hi:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.10);
    --text:#e8eaf6;
    --muted:#7986cb;
    --accent:#ffd54f;
    --radius:14px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; min-height:100vh; overflow-x:hidden; }
  #stars { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .wrap { position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:28px 16px 80px; }

  header h1 { font-size:clamp(1.6rem,4vw,2.3rem); letter-spacing:.06em; background:linear-gradient(90deg,#ffd54f,#ff8a80,#b388ff,#80d8ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p { color:var(--muted); margin-top:6px; font-size:.92rem; }

  section { margin-top:34px; }
  .sec-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .sec-head h2 { font-size:1.2rem; }
  .sec-head .hint { color:var(--muted); font-size:.85rem; }
  .btn { background:var(--surface-hi); border:1px solid var(--border); color:var(--text); border-radius:999px; padding:7px 16px; font-size:.9rem; cursor:pointer; transition:background .15s,border-color .15s; }
  .btn:hover { background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.3); }

  /* ── 特效展示區 ── */
  .showcase { display:grid; grid-template-columns:repeat(6,1fr); gap:34px 22px; padding:10px 6px; }
  @media (max-width:1100px) { .showcase { grid-template-columns:repeat(3,1fr); } }
  .show-item { display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; }
  .show-item .fx-card { width:100%; max-width:230px; }
  .fx-label { font-size:.82rem; color:var(--muted); text-align:center; line-height:1.4; }
  .fx-label b { color:var(--text); font-weight:600; display:block; font-size:.92rem; }

  /* ── 特效卡本體 ──
     --px/--py：指標位置(0~100)，--rx/--ry：傾斜角度，--o：特效強度(0~1)
     所有光澤圖層都用卡圖本身當mask，只亮在卡面像素上（圓角/透明邊自動處理） */
  .fx-card { --px:50; --py:50; --rx:0deg; --ry:0deg; --o:0; --tc:#ffd54f;
    position:relative; aspect-ratio:600/825; border-radius:4.6% / 3.4%;
    transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));
    transition:transform .45s cubic-bezier(.2,.8,.2,1); will-change:transform; }
  .fx-card.live { transition:none; }
  .fx-card > img { width:100%; height:100%; display:block; border-radius:inherit; box-shadow:0 14px 34px rgba(0,0,0,.55); user-select:none; -webkit-user-drag:none; }
  .fx-layer { position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    -webkit-mask:var(--img) center / 100% 100% no-repeat; mask:var(--img) center / 100% 100% no-repeat; }
  .fx-glare { background:radial-gradient(farthest-corner circle at calc(var(--px)*1%) calc(var(--py)*1%), rgba(255,255,255,.85) 0%, rgba(255,255,255,.25) 22%, rgba(0,0,0,.45) 95%);
    mix-blend-mode:overlay; opacity:calc(var(--o) * .75); }
  .fx-card[data-fx="none"] .fx-shine, .fx-card[data-fx="none"] .fx-extra { display:none; }

  /* 1. 彩虹全息 */
  .fx-card[data-fx="holo"] .fx-shine {
    background:
      repeating-linear-gradient(110deg, #ff3d7f 0%, #ffcf3d 4%, #4dff9e 8%, #3dd5ff 12%, #a66bff 16%, #ff3d7f 20%),
      repeating-linear-gradient(-45deg, #0e152e 0%, #8fb3b3 3.8%, #a8d5d5 4.5%, #8fb3b3 5.2%, #0e152e 10%, #0e152e 12%);
    background-size:400% 400%, 300% 300%;
    background-position:calc(var(--px)*1%) calc(var(--py)*1%), calc(100% - var(--px)*1%) calc(100% - var(--py)*1%);
    background-blend-mode:hard-light;
    mix-blend-mode:color-dodge; filter:brightness(.55) contrast(1.6) saturate(1.3);
    opacity:calc(var(--o) * .85); }

  /* 2. 金箔閃耀 */
  .fx-card[data-fx="gold"] .fx-shine {
    background:
      radial-gradient(circle, rgba(255,255,255,.95) 0 1px, transparent 1.6px) 0 0 / 19px 19px,
      radial-gradient(circle, rgba(255,240,180,.9) 0 1px, transparent 1.8px) 7px 11px / 31px 31px,
      linear-gradient(120deg, #6b4a08 0%, #ffe7a0 18%, #b9871c 32%, #fff6cf 48%, #a8781a 62%, #ffdf7e 80%, #7a560c 100%);
    background-size:19px 19px, 31px 31px, 300% 300%;
    background-position:calc(var(--px)*.3px) calc(var(--py)*.3px), calc(var(--px)*-.5px) calc(var(--py)*-.4px), calc(var(--px)*1%) calc(var(--py)*1%);
    mix-blend-mode:overlay; opacity:calc(.25 + var(--o) * .7); }
  .fx-card[data-fx="gold"] { box-shadow:0 0 calc(10px + var(--o)*26px) rgba(255,205,80,.45); }

  /* 3. 銀河星雲 */
  .fx-card[data-fx="galaxy"] .fx-shine {
    background:
      radial-gradient(circle at 12% 18%, #fff 0 .8px, transparent 1.4px) 0 0 / 23px 29px,
      radial-gradient(circle at 70% 60%, #cfe8ff 0 .7px, transparent 1.3px) 0 0 / 37px 41px,
      radial-gradient(ellipse at 22% 30%, rgba(124,77,255,.95), transparent 45%),
      radial-gradient(ellipse at 78% 68%, rgba(255,64,160,.85), transparent 48%),
      radial-gradient(ellipse at 62% 18%, rgba(0,212,255,.8), transparent 42%),
      radial-gradient(ellipse at 30% 85%, rgba(0,255,170,.55), transparent 45%);
    background-size:23px 29px, 37px 41px, 160% 160%, 160% 160%, 160% 160%, 160% 160%;
    background-position:calc(var(--px)*.4px) calc(var(--py)*.4px), calc(var(--px)*-.25px) calc(var(--py)*-.25px),
      calc(var(--px)*.6%) calc(var(--py)*.6%), calc(100% - var(--px)*.6%) calc(var(--py)*.5%),
      calc(var(--px)*.4%) calc(100% - var(--py)*.5%), calc(100% - var(--px)*.5%) calc(100% - var(--py)*.6%);
    mix-blend-mode:color-dodge; opacity:calc(.3 + var(--o) * .55);
    animation:hueDrift 9s linear infinite; }
  @keyframes hueDrift { to { filter:hue-rotate(360deg); } }

  /* 4. 稜鏡碎光 */
  .fx-card[data-fx="prism"] .fx-shine {
    background:
      repeating-linear-gradient(45deg, transparent 0 9px, rgba(0,0,0,.55) 9px 10px),
      repeating-linear-gradient(-45deg, transparent 0 9px, rgba(0,0,0,.55) 9px 10px),
      conic-gradient(from calc(var(--px)*3.6deg + var(--py)*1.8deg) at calc(var(--px)*1%) calc(var(--py)*1%),
        #ff4d4d, #ffd84d, #6bff4d, #4dfff3, #4d7bff, #e14dff, #ff4d4d);
    mix-blend-mode:color-dodge; filter:brightness(.7) contrast(1.4);
    opacity:calc(var(--o) * .75); }

  /* 5. 屬性氣場（顏色跟卡片主屬性） */
  .fx-card[data-fx="aura"] { animation:auraPulse 2.4s ease-in-out infinite; }
  @keyframes auraPulse {
    0%,100% { box-shadow:0 0 14px 2px color-mix(in srgb, var(--tc) 55%, transparent), 0 0 40px 6px color-mix(in srgb, var(--tc) 25%, transparent); }
    50%     { box-shadow:0 0 24px 6px color-mix(in srgb, var(--tc) 80%, transparent), 0 0 70px 16px color-mix(in srgb, var(--tc) 35%, transparent); }
  }
  .fx-card[data-fx="aura"] .fx-shine {
    background:radial-gradient(circle at calc(var(--px)*1%) calc(var(--py)*1%), color-mix(in srgb, var(--tc) 90%, white) 0%, transparent 55%);
    mix-blend-mode:color-dodge; opacity:calc(.15 + var(--o) * .55); }
  .fx-extra { position:absolute; inset:0; pointer-events:none; border-radius:inherit; }
  .ember { position:absolute; bottom:4%; width:var(--s); height:var(--s); border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--tc) 45%, transparent 70%);
    left:var(--x); opacity:0; animation:emberRise var(--d) ease-out var(--delay) infinite; filter:blur(.3px); }
  @keyframes emberRise {
    0% { transform:translate(0,0) scale(1); opacity:0; }
    12% { opacity:1; }
    100% { transform:translate(var(--drift), -260%) translateY(-120px) scale(.3); opacity:0; }
  }

  /* 6. 流光掃描 */
  .fx-card[data-fx="sweep"] .fx-shine {
    background:linear-gradient(105deg, transparent 38%, rgba(255,255,255,.0) 42%, rgba(255,255,255,.85) 50%, rgba(180,220,255,.5) 53%, transparent 62%);
    background-size:260% 100%; mix-blend-mode:overlay; opacity:.95;
    animation:sweep 3.2s ease-in-out infinite; }
  @keyframes sweep { 0% { background-position:150% 0; } 55%,100% { background-position:-60% 0; } }

  /* 金箔/流光的閃爍小星星 */
  .twinkle { position:absolute; left:var(--x); top:var(--y); font-size:var(--s); color:#fff; line-height:1;
    text-shadow:0 0 6px #fff, 0 0 12px var(--tc); opacity:0; animation:twinkle var(--d) ease-in-out var(--delay) infinite; }
  @keyframes twinkle { 0%,100% { opacity:0; transform:scale(.3) rotate(0); } 50% { opacity:1; transform:scale(1) rotate(45deg); } }

  /* ── 圖鑑 ── */
  .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; }
  .filters input, .filters select { background:rgba(0,0,0,.3); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:8px 10px; font-size:.9rem; }
  .filters input { flex:1 1 200px; min-width:0; }
  .filters select { flex:0 1 auto; max-width:100%; }
  .type-chips { display:flex; flex-wrap:wrap; gap:6px; width:100%; }
  .chip { border:1px solid var(--border); background:transparent; color:var(--text); border-radius:999px; padding:4px 11px; font-size:.8rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .chip .dot { width:10px; height:10px; border-radius:50%; }
  .chip.on { background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.45); }
  .count { color:var(--muted); font-size:.85rem; margin:12px 2px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:14px; }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:7px; cursor:pointer; transition:transform .15s, border-color .15s, box-shadow .15s; }
  .tile:hover { transform:translateY(-4px); border-color:rgba(255,255,255,.3); box-shadow:0 8px 22px rgba(0,0,0,.4); }
  .tile .thumb { aspect-ratio:600/825; border-radius:7px; overflow:hidden; background:rgba(255,255,255,.04); }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .nm { font-size:.82rem; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .meta { font-size:.72rem; color:var(--muted); display:flex; justify-content:space-between; gap:4px; }
  .rar { color:var(--accent); letter-spacing:-1px; white-space:nowrap; }
  #sentinel { height:40px; }

  /* ── 詳情彈窗 ── */
  .modal { position:fixed; inset:0; z-index:50; background:rgba(3,4,12,.82); backdrop-filter:blur(6px); display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:30px 16px; }
  .modal.open { display:flex; }
  .modal-body { position:relative; display:flex; gap:34px; align-items:flex-start; max-width:900px; width:100%; background:rgba(20,24,52,.6); border:1px solid var(--border); border-radius:20px; padding:28px; }
  .modal-close { position:absolute; top:10px; right:14px; background:none; border:none; color:var(--muted); font-size:1.7rem; cursor:pointer; }
  .modal-left { flex:0 0 340px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .modal-left .fx-card { width:100%; }
  .fx-picker { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .modal-right { flex:1; min-width:0; }
  .modal-right h3 { font-size:1.5rem; }
  .modal-right .en { color:var(--muted); font-size:.9rem; margin-top:2px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; }
  .tag { font-size:.78rem; padding:3px 10px; border-radius:999px; background:var(--surface-hi); border:1px solid var(--border); }
  .block { margin-top:14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .block .t { display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:600; }
  .block .d { color:#c5cae9; font-size:.86rem; margin-top:6px; line-height:1.55; white-space:pre-line; }
  .cost { display:inline-flex; gap:3px; margin-right:8px; vertical-align:middle; }
  .eicon { width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:.62rem; color:#111; font-weight:700; }
  .dmg { font-size:1.1rem; color:var(--accent); }
  .ab-tag { font-size:.7rem; background:#c62828; color:#fff; border-radius:4px; padding:1px 6px; margin-right:6px; }
  .footline { color:var(--muted); font-size:.82rem; margin-top:14px; display:flex; gap:16px; flex-wrap:wrap; }
  .err { background:rgba(255,82,82,.12); border:1px solid rgba(255,82,82,.4); border-radius:12px; padding:14px; margin-top:20px; line-height:1.6; }
  .err code { background:rgba(0,0,0,.35); padding:1px 6px; border-radius:4px; }

  @media (max-width:760px) {
    .modal-body { flex-direction:column; align-items:center; padding:22px 16px; }
    .modal-left { flex:none; width:min(300px,100%); }
    .showcase { grid-template-columns:repeat(2,1fr); gap:24px 14px; }
    .grid { grid-template-columns:repeat(3,1fr); gap:9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fx-shine, .ember, .twinkle, .fx-card { animation:none !important; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <header>
    <h1>✦ 卡牌圖鑑・特效館</h1>
    <p>Pocket TCG 全系列卡片收藏瀏覽。滑鼠移到卡片上會跟著傾斜反光，點任一張卡可以放大、切換特效。</p>
  </header>

  <section>
    <div class="sec-head">
      <h2>🌟 特效展示區</h2>
      <button class="btn" id="reroll">🎲 再抽一組</button>
      <span class="hint">從高稀有度卡／ex 隨機挑 6 張，每張套一種不同特效</span>
    </div>
    <div class="showcase" id="showcase"></div>
  </section>

  <section>
    <div class="sec-head"><h2>📖 全卡圖鑑</h2></div>
    <div class="filters">
      <input id="q" type="search" placeholder="搜尋中文名／英文名／卡號…">
      <select id="f-set"><option value="">全部系列</option></select>
      <select id="f-cat">
        <option value="">全部類別</option>
        <option value="Pokemon">寶可夢</option>
        <option value="Trainer">訓練家</option>
      </select>
      <select id="f-rar"><option value="">全部稀有度</option></select>
      <select id="f-sort">
        <option value="id">依卡號</option>
        <option value="rar">稀有度高→低</option>
        <option value="hp">HP 高→低</option>
      </select>
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="f-ex" style="accent-color:#ffd54f"> 只看 ex</label>
      <div class="type-chips" id="type-chips"></div>
    </div>
    <div class="count" id="count">載入中…</div>
    <div class="grid" id="grid"></div>
    <div id="sentinel"></div>
  </section>
</div>

<div class="modal" id="modal">
  <div class="modal-body">
    <button class="modal-close" id="modal-close" aria-label="關閉">×</button>
    <div class="modal-left">
      <div id="modal-card"></div>
      <div class="fx-picker" id="fx-picker"></div>
    </div>
    <div class="modal-right" id="modal-info"></div>
  </div>
</div>

<script>
/* 星空背景 */
(function () {
  const c = document.getElementById('stars'), ctx = c.getContext('2d');
  let stars = [];
  function resize() {
    c.width = innerWidth; c.height = innerHeight;
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 5000) }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: Math.random() * 1.3 + .2, p: Math.random() * Math.PI * 2, s: Math.random() * .02 + .005,
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const s of stars) {
      s.p += s.s;
      ctx.globalAlpha = .35 + Math.sin(s.p) * .3;
      ctx.fillStyle = '#c5cae9';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize', resize); resize(); draw();
})();

const TYPE_COLOR = {
  Fire:'#f08030', Water:'#6890f0', Lightning:'#f8d030', Psychic:'#f85888',
  Fighting:'#c03028', Darkness:'#705848', Dragon:'#7038f8', Colorless:'#a8a878', Grass:'#78c850',
  Metal:'#a8b8c8'
};
const TYPE_ZH = {
  Fire:'火', Water:'水', Lightning:'電', Psychic:'超能力',
  Fighting:'格鬥', Darkness:'惡', Dragon:'龍', Colorless:'無色', Grass:'草',
  Metal:'鋼'
};
const RARITY = {
  'One Diamond':   { zh:'◆',      rank:1 },
  'Two Diamond':   { zh:'◆◆',     rank:2 },
  'Three Diamond': { zh:'◆◆◆',    rank:3 },
  'Four Diamond':  { zh:'◆◆◆◆',   rank:4 },
  'One Star':      { zh:'★',      rank:5 },
  'One Shiny':     { zh:'✧',      rank:5.5 },
  'Two Star':      { zh:'★★',     rank:6 },
  'Three Star':    { zh:'★★★',    rank:7 },
  'Crown':         { zh:'👑',     rank:8 },
  'None':          { zh:'—',      rank:0 },
};
const TRAINER_ZH = { Supporter:'支援者', Item:'物品', Tool:'寶可夢道具', Stadium:'競技場' };
const STAGE_ZH = { Basic:'基礎', 'Stage 1':'1階進化', 'Stage 2':'2階進化' };

const FX = [
  { id:'holo',   name:'彩虹全息', desc:'跟著角度流動的彩虹全息光' },
  { id:'gold',   name:'金箔閃耀', desc:'金箔紋理＋細碎閃粉' },
  { id:'galaxy', name:'銀河星雲', desc:'視差星空與緩慢變色的星雲' },
  { id:'prism',  name:'稜鏡碎光', desc:'菱格切面的七彩折射' },
  { id:'aura',   name:'屬性氣場', desc:'屬性色光暈＋上升的能量粒子' },
  { id:'sweep',  name:'流光掃描', desc:'週期掃過卡面的高光' },
  { id:'none',   name:'無特效',   desc:'' },
];
const FX_BY_ID = Object.fromEntries(FX.map(f => [f.id, f]));

// 依稀有度給預設特效（彈窗打開時用，可以再自己切換）
function autoFx(card) {
  switch (card.rarity) {
    case 'Crown': return 'gold';
    case 'Three Star': return 'galaxy';
    case 'Two Star': return 'prism';
    case 'One Star': return 'holo';
    case 'One Shiny': return 'sweep';
  }
  return card.ex ? 'aura' : 'sweep';
}

// 縮圖規則跟 pocket.html 的 pocketThumbUrl 相同
function thumbUrl(image) {
  if (!image) return image;
  if (image.endsWith('/high.webp')) return image.replace('/high.webp', '/low.webp');
  if (image.endsWith('_EN.png')) return image.replace('_EN.png', '_EN_SM.webp');
  if (image.startsWith('/card-art/')) return image.replace(/\.jpg(\?|$)/, '-sm.jpg$1');
  if (image.startsWith('/card-img/')) return image.replace(/\.webp$/, '-sm.webp');
  return image;
}
document.addEventListener('error', e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || img.dataset.fallback || !img.dataset.full) return;
  img.dataset.fallback = '1';
  img.src = img.dataset.full;
}, true);

const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));
const zhName = c => c.zh_name || c.name;
const rarZh = r => (RARITY[r] || { zh:'' }).zh;
const rarRank = r => (RARITY[r] || { rank:0 }).rank;

/* ── 特效卡元件 ── */
const fxCards = new Set(); // 目前畫面上的特效卡，閒置時自動擺動
function makeFxCard(card, fx, { hd = false } = {}) {
  const src = hd ? card.image : thumbUrl(card.image);
  const el = document.createElement('div');
  el.className = 'fx-card';
  el.dataset.fx = fx;
  el.style.setProperty('--img', `url("${src}")`);
  el.style.setProperty('--tc', TYPE_COLOR[(card.types || [])[0]] || '#ffd54f');
  el.innerHTML = `<img src="${esc(src)}" data-full="${esc(card.image)}" alt="${esc(zhName(card))}" draggable="false">
    <div class="fx-layer fx-shine"></div><div class="fx-layer fx-glare"></div><div class="fx-extra"></div>`;
  buildExtras(el);
  el._phase = Math.random() * 10;
  el._hover = false;
  el.addEventListener('pointermove', e => {
    const r = el.getBoundingClientRect();
    const px = Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100));
    const py = Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100));
    el._hover = true; el.classList.add('live');
    setPose(el, px, py, 1, 1);
  });
  el.addEventListener('pointerleave', () => {
    el._hover = false; el.classList.remove('live');
    setPose(el, 50, 50, 0, 0);
  });
  fxCards.add(el);
  return el;
}
function setPose(el, px, py, o, tilt) {
  el.style.setProperty('--px', px.toFixed(2));
  el.style.setProperty('--py', py.toFixed(2));
  el.style.setProperty('--o', o.toFixed(3));
  el.style.setProperty('--ry', `${((px - 50) / 50 * 14 * tilt).toFixed(2)}deg`);
  el.style.setProperty('--rx', `${((50 - py) / 50 * 12 * tilt).toFixed(2)}deg`);
}
// 屬性氣場的粒子、金箔/流光的小星星
function buildExtras(el) {
  const box = el.querySelector('.fx-extra');
  const fx = el.dataset.fx;
  let html = '';
  const rnd = (a, b) => a + Math.random() * (b - a);
  if (fx === 'aura') {
    for (let i = 0; i < 16; i++) html += `<span class="ember" style="--x:${rnd(4, 92)}%;--s:${rnd(4, 9).toFixed(1)}px;--d:${rnd(2.2, 4).toFixed(2)}s;--delay:${rnd(0, 4).toFixed(2)}s;--drift:${rnd(-24, 24).toFixed(0)}px"></span>`;
  } else if (fx === 'gold' || fx === 'sweep' || fx === 'galaxy') {
    const n = fx === 'gold' ? 9 : 5;
    for (let i = 0; i < n; i++) html += `<span class="twinkle" style="--x:${rnd(5, 88)}%;--y:${rnd(5, 90)}%;--s:${rnd(10, 20).toFixed(0)}px;--d:${rnd(1.6, 3.2).toFixed(2)}s;--delay:${rnd(0, 3).toFixed(2)}s">✦</span>`;
  }
  box.innerHTML = html;
}
function setFx(el, fx) { el.dataset.fx = fx; buildExtras(el); }

// 沒被滑鼠碰的特效卡自己慢慢擺動，讓光澤一直看得到
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function idleLoop(t) {
  const s = t / 1000;
  for (const el of fxCards) {
    if (!el.isConnected) { fxCards.delete(el); continue; }
    if (el._hover || reduceMotion) continue;
    const p = el._phase;
    el.classList.add('live');
    setPose(el, 50 + 32 * Math.sin(s * .55 + p), 50 + 26 * Math.sin(s * .8 + p * 1.7), .55 + .2 * Math.sin(s * 1.3 + p), .55);
  }
  requestAnimationFrame(idleLoop);
})(0);

/* ── 資料載入 ── */
let ALL = [], SETS = [];
async function loadData() {
  // 先試 server.js 的 API（含 public/card-art 換過的修正卡圖），沒開 server 時退回靜態 json
  try {
    const [c, s] = await Promise.all([fetch('/api/pocket/cards'), fetch('/api/pocket/sets')]);
    if (!c.ok || !s.ok) throw 0;
    ALL = (await c.json()).cards; SETS = (await s.json()).sets;
  } catch {
    const r = await fetch('/pocket-cards.json');
    if (!r.ok) throw new Error('load failed');
    const d = await r.json();
    ALL = d.cards; SETS = d.sets;
  }
  ALL = ALL.filter(c => c.image);
}

/* ── 特效展示區 ── */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rollShowcase() {
  const pool = ALL.filter(c => rarRank(c.rarity) >= 5 || c.ex);
  const picks = shuffle(pool).slice(0, 6);
  const fxs = shuffle(FX.filter(f => f.id !== 'none'));
  const box = document.getElementById('showcase');
  box.innerHTML = '';
  picks.forEach((card, i) => {
    const fx = fxs[i % fxs.length];
    const item = document.createElement('div');
    item.className = 'show-item';
    item.appendChild(makeFxCard(card, fx.id, { hd: true }));
    item.insertAdjacentHTML('beforeend', `<div class="fx-label"><b>${esc(zhName(card))}</b>${fx.name}・${esc(card.id)} <span class="rar">${rarZh(card.rarity)}</span></div>`);
    item.addEventListener('click', () => openModal(card, fx.id));
    box.appendChild(item);
  });
}

/* ── 圖鑑 ── */
const state = { q:'', set:'', cat:'', rar:'', sort:'id', ex:false, types:new Set() };
let filtered = [], shown = 0;
const PAGE = 96;

function buildFilters() {
  const setSel = document.getElementById('f-set');
  for (const s of SETS) setSel.insertAdjacentHTML('beforeend', `<option value="${esc(s.id)}">${esc(s.id)}・${esc(s.name)}</option>`);
  const rarSel = document.getElementById('f-rar');
  const present = new Set(ALL.map(c => c.rarity));
  Object.entries(RARITY).sort((a, b) => a[1].rank - b[1].rank)
    .filter(([k]) => present.has(k))
    .forEach(([k, v]) => rarSel.insertAdjacentHTML('beforeend', `<option value="${esc(k)}">${v.zh}　${k}</option>`));
  const chips = document.getElementById('type-chips');
  for (const t of Object.keys(TYPE_COLOR)) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.innerHTML = `<span class="dot" style="background:${TYPE_COLOR[t]}"></span>${TYPE_ZH[t]}`;
    b.onclick = () => { state.types.has(t) ? state.types.delete(t) : state.types.add(t); b.classList.toggle('on'); applyFilters(); };
    chips.appendChild(b);
  }
  const bind = (id, key, ev = 'change', get = el => el.value) => {
    const el = document.getElementById(id);
    el.addEventListener(ev, () => { state[key] = get(el); applyFilters(); });
  };
  bind('q', 'q', 'input', el => el.value.trim().toLowerCase());
  bind('f-set', 'set'); bind('f-cat', 'cat'); bind('f-rar', 'rar'); bind('f-sort', 'sort');
  bind('f-ex', 'ex', 'change', el => el.checked);
}

function applyFilters() {
  const { q, set, cat, rar, ex, types, sort } = state;
  filtered = ALL.filter(c =>
    (!set || c.set === set) &&
    (!cat || c.category === cat) &&
    (!rar || c.rarity === rar) &&
    (!ex || c.ex) &&
    (!types.size || (c.types || []).some(t => types.has(t))) &&
    (!q || [c.zh_name, c.name, c.id].some(v => v && v.toLowerCase().includes(q)))
  );
  if (sort === 'rar') filtered.sort((a, b) => rarRank(b.rarity) - rarRank(a.rarity));
  else if (sort === 'hp') filtered.sort((a, b) => (b.hp || 0) - (a.hp || 0));
  document.getElementById('count').textContent = `共 ${filtered.length} 張`;
  document.getElementById('grid').innerHTML = '';
  shown = 0;
  renderMore();
}

function renderMore() {
  const grid = document.getElementById('grid');
  const html = filtered.slice(shown, shown + PAGE).map((c, i) => `
    <div class="tile" data-i="${shown + i}">
      <div class="thumb"><img loading="lazy" src="${esc(thumbUrl(c.image))}" data-full="${esc(c.image)}" alt=""></div>
      <div class="nm">${esc(zhName(c))}</div>
      <div class="meta"><span>${esc(c.id)}</span><span class="rar">${rarZh(c.rarity)}</span></div>
    </div>`).join('');
  grid.insertAdjacentHTML('beforeend', html);
  shown = Math.min(filtered.length, shown + PAGE);
}

document.getElementById('grid').addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (tile) { const c = filtered[+tile.dataset.i]; openModal(c, autoFx(c)); }
});
new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && shown < filtered.length) renderMore();
}, { rootMargin:'800px' }).observe(document.getElementById('sentinel'));

/* ── 詳情彈窗 ── */
const modal = document.getElementById('modal');
function energyIcons(cost) {
  return `<span class="cost">${(cost || []).map(t => `<span class="eicon" style="background:${TYPE_COLOR[t] || '#888'}" title="${TYPE_ZH[t] || t}">${(TYPE_ZH[t] || '?')[0]}</span>`).join('')}</span>`;
}
function openModal(card, fx) {
  const holder = document.getElementById('modal-card');
  holder.innerHTML = '';
  const el = makeFxCard(card, fx, { hd: true });
  holder.appendChild(el);

  const picker = document.getElementById('fx-picker');
  picker.innerHTML = '';
  for (const f of FX) {
    const b = document.createElement('button');
    b.className = 'chip' + (f.id === fx ? ' on' : '');
    b.textContent = f.name;
    b.title = f.desc;
    b.onclick = () => { setFx(el, f.id); picker.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); };
    picker.appendChild(b);
  }

  const tags = [];
  if (card.category === 'Pokemon') {
    (card.types || []).forEach(t => tags.push(`<span class="tag" style="border-color:${TYPE_COLOR[t]};color:${TYPE_COLOR[t]}">${TYPE_ZH[t] || t}</span>`));
    if (card.stage) tags.push(`<span class="tag">${STAGE_ZH[card.stage] || card.stage}</span>`);
    if (card.hp) tags.push(`<span class="tag">HP ${card.hp}</span>`);
    if (card.ex) tags.push(`<span class="tag" style="color:#ffd54f">ex</span>`);
  } else {
    tags.push(`<span class="tag">${TRAINER_ZH[card.trainerType] || card.trainerType || card.category}</span>`);
  }
  if (card.rarity) tags.push(`<span class="tag"><span class="rar">${rarZh(card.rarity)}</span> ${esc(card.rarity)}</span>`);

  const blocks = [];
  for (const a of card.abilities || []) {
    blocks.push(`<div class="block"><div class="t"><span><span class="ab-tag">特性</span>${esc(a.name_zh || a.name)}</span></div><div class="d">${esc(a.effect_zh || a.effect || '')}</div></div>`);
  }
  for (const a of card.attacks || []) {
    blocks.push(`<div class="block"><div class="t"><span>${energyIcons(a.cost)}${esc(a.name_zh || a.name)}</span><span class="dmg">${esc(a.damage ?? '')}</span></div>${a.effect_zh || a.effect ? `<div class="d">${esc(a.effect_zh || a.effect)}</div>` : ''}</div>`);
  }
  if (card.category !== 'Pokemon' && (card.effect_zh || card.effect)) {
    blocks.push(`<div class="block"><div class="d" style="margin:0">${esc(card.effect_zh || card.effect)}</div></div>`);
  }
  const foot = [];
  if (card.weaknesses?.length) foot.push(`弱點：${card.weaknesses.map(w => `${TYPE_ZH[w.type] || w.type} ${esc(w.value)}`).join('、')}`);
  if (card.retreat != null) foot.push(`撤退：${card.retreat}`);
  if (card.evolveFrom) foot.push(`進化自：${esc(card.evolveFrom)}`);
  foot.push(`${esc(card.id)}・${esc(card.setName || card.set)}`);

  document.getElementById('modal-info').innerHTML = `
    <h3>${esc(zhName(card))}</h3>
    <div class="en">${esc(card.name)}</div>
    <div class="tags">${tags.join('')}</div>
    ${blocks.join('')}
    <div class="footline">${foot.map(f => `<span>${f}</span>`).join('')}</div>`;
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('modal-card').innerHTML = '';
}
document.getElementById('modal-close').onclick = closeModal;
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
document.getElementById('reroll').onclick = rollShowcase;

loadData().then(() => {
  buildFilters();
  rollShowcase();
  applyFilters();
}).catch(() => {
  document.getElementById('count').innerHTML = `<div class="err">讀不到卡片資料。這個頁面要透過伺服器開啟（直接雙擊 html 檔案的話瀏覽器會擋讀取）：<br>
    在專案資料夾執行 <code>node server.js</code> 後開 <code>http://localhost:3000/cardex.html</code>，<br>
    或執行 <code>python3 -m http.server 8000 -d public</code> 後開 <code>http://localhost:8000/cardex.html</code>。</div>`;
});
</script>
</body>
